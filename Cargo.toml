[package]
name = "avash"
version = "0.1.0"
edition = "2021"
description = "Avash — native SSH/RDP connection manager. Light, fast, secure, multi-platform."
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
dirs = "5"
anyhow = "1"
smol = "2"
whoami = "1"

[dev-dependencies]
log = "0.4.34"
