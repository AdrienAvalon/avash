[package]
name = "test-vnc-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "Avash — serveur VNC de test pour la suite bout en bout"
license = "AGPL-3.0-or-later"

[dependencies]
# Serveur RFB complet (ZRLE, Tight, Raw, authentification VNC) : ce que le
# client d'avash rencontre en face d'un vrai serveur, sans machine de plus.
rustvncserver = { version = "2.2.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
pico-args = "0.5"
# VeNCrypt : un terminateur TLS devant le serveur RFB, pour éprouver le client.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
anyhow = "1"

# Politique de sûreté commune au processus RDP et aux serveurs de test (audit
# du 12 septembre 2026, unsafe.md) : ce paquet n'hérite de rien, l'espace de
# travail ne le couvre pas. Aucun `unsafe` ici hors de `vendor/` (dont les
# paquets gardent leurs propres réglages) : ces lints ne coûtent rien et
# signalent le premier qui arriverait sans justification.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
deprecated_safe_2024 = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
