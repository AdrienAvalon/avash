# Mises à jour de dépendances proposées en demandes de fusion, et alertes de
# vulnérabilité sur les quatre arbres : workspace Rust, processus RDP, front,
# suite bout en bout. Les actions GitHub aussi : une action épinglée sur un tag
# mobile est un maillon faible de la chaîne.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      cargo-mineur: { update-types: [minor, patch] }
  - package-ecosystem: cargo
    directory: /rdp-sidecar
    schedule: { interval: weekly, day: monday }
    groups:
      sidecar-mineur: { update-types: [minor, patch] }
    ignore:
      # x509-cert est aussi une dépendance des paquets IronRDP portés : la
      # version doit être la leur, sinon deux types `Certificate` cohabitent
      # et rien ne compile. À remonter quand IronRDP change.
      - dependency-name: x509-cert
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups:
      front-mineur: { update-types: [minor, patch] }
    ignore:
      # typescript-eslint borne la version de TypeScript qu'il accepte : une
      # majeure de TypeScript casse l'installation tant qu'il ne l'a pas
      # suivie. À lever quand typescript-eslint annonce TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
  # L'image de base de la chaîne GitLab est épinglée par empreinte
  # (ci/Dockerfile) : c'est Dependabot qui propose la suivante.
  - package-ecosystem: docker
    directory: /ci
    schedule: { interval: weekly, day: monday }
