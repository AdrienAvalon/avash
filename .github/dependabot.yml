# Mises à jour de dépendances proposées en demandes de fusion, et alertes de
# vulnérabilité sur les quatre arbres : workspace Rust, processus RDP, front,
# suite bout en bout. Les actions GitHub aussi : une action épinglée sur un tag
# mobile est un maillon faible de la chaîne.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      cargo-mineur: { update-types: [minor, patch] }
    ignore:
      # Serveur WebDriver embarqué de la suite bout en bout, épinglé sur la
      # 1.5.0 : la 1.5.1 réécrit l'émulation du clavier et casse Maj+Tab dans
      # une boîte de dialogue (reproduit sur Linux le 21 novembre 2026, voir
      # crates/avash-ui/Cargo.toml). Une version à la fois : retirer cette
      # entrée pour essayer la suivante.
      - dependency-name: tauri-plugin-wdio-webdriver
        versions: ["1.5.1"]
  - package-ecosystem: cargo
    directory: /rdp-sidecar
    schedule: { interval: weekly, day: monday }
    groups:
      sidecar-mineur: { update-types: [minor, patch] }
    ignore:
      # x509-cert est aussi une dépendance des paquets IronRDP portés : la
      # version doit être la leur, sinon deux types `Certificate` cohabitent
      # et rien ne compile. À remonter quand IronRDP change.
      - dependency-name: x509-cert
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups:
      front-mineur: { update-types: [minor, patch] }
      # vitest et ses greffons (@vitest/coverage-v8) exigent la même majeure :
      # montés séparément, l'un des deux ne s'installe plus (ERESOLVE vu sur les
      # PR #18 et #19 de la 5.0.0, toutes chaînes rouges). Un seul groupe, toutes
      # versions confondues, pour qu'ils bougent ensemble.
      vitest: { patterns: ["vitest", "@vitest/*"] }
    ignore:
      # typescript-eslint borne la version de TypeScript qu'il accepte : une
      # majeure de TypeScript casse l'installation tant qu'il ne l'a pas
      # suivie. À lever quand typescript-eslint annonce TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: monthly }
    groups:
      # Les paquets @wdio/* sortent ensemble et partagent e2e/package-lock.json :
      # proposés un par un (#46 à #49, octobre 2026), chaque fusion mettait les
      # autres en conflit sur le verrou, et l'un d'eux devenait sans objet.
      wdio: { patterns: ["@wdio/*", "webdriverio"] }
      e2e-mineur: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      # Les trois étapes de codeql-action (init, analyze, upload-sarif) doivent
      # rester à la même version : proposées séparément (#37, #39, #40,
      # octobre 2026), init et analyze désaccordées faisaient échouer CodeQL, et
      # il a fallu les regrouper à la main (#57). Toutes versions confondues.
      codeql: { patterns: ["github/codeql-action/*"] }
      actions-mineur: { update-types: [minor, patch] }
    ignore:
      # L'image de la v2.6.0 a perdu ses manifestes sur ghcr.io le 24 novembre
      # 2026 (ossf/scorecard-action#1752) : l'action ne se lance plus. On reste
      # sur la v2.5.0 (voir .github/workflows/securite.yml) ; retirer cette
      # entrée quand l'amont a réparé l'image ou publié la suivante.
      - dependency-name: ossf/scorecard-action
        versions: ["2.6.0"]
  # L'image de base de la chaîne GitLab est épinglée par empreinte
  # (ci/Dockerfile) : c'est Dependabot qui propose la suivante.
  - package-ecosystem: docker
    directory: /ci
    schedule: { interval: weekly, day: monday }
