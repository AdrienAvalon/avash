# Mises à jour de dépendances proposées en demandes de fusion, et alertes de
# vulnérabilité sur les quatre arbres : workspace Rust, processus RDP, front,
# suite bout en bout. Les actions GitHub aussi : une action épinglée sur un tag
# mobile est un maillon faible de la chaîne.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      cargo-mineur: { update-types: [minor, patch] }
  - package-ecosystem: cargo
    directory: /rdp-sidecar
    schedule: { interval: weekly, day: monday }
    groups:
      sidecar-mineur: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups:
      front-mineur: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
