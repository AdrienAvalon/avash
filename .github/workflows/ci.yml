name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Cœur (avash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chaîne Rust stable + composants
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Le format et clippy passent avant les tests : un echec ici est
      # instantane, inutile de compiler la suite pour l'apprendre.
      - name: Format
        run: cargo fmt --check

      - name: Clippy (avertissements = erreurs)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release
