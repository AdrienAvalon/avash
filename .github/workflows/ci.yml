name: CI

# Une poussée qui en suit une autre de près rend la précédente sans objet : on
# annule ce qui tourne encore pour la même branche, et les exécuteurs Windows et
# macOS — les plus rares — vont au dernier commit. Une exécution planifiée ou
# une PR a son propre groupe.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Le jeton des jobs ne sait que lire : rien ici ne publie ni n'écrit dans le dépôt.
permissions:
  contents: read

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Avash — lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri exige webkit2gtk et ses dependances systeme sur Linux.
      - name: Dépendances système Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # --- Front d'abord : le build Rust de avash-ui exige web/dist ---
      - name: Front — dépendances
        working-directory: web
        run: npm ci

      # La chaîne Rust est auditée (cargo audit + deny) ; le front, périmètre de
      # confiance réel (une dépendance npm hostile exécute du code dans la webview),
      # ne l'était pas. On échoue sur une vulnérabilité « high » ou pire.
      - name: Front — audit des dépendances
        working-directory: web
        run: npm audit --audit-level=high

      # Garde anti-etourderie : bloque les restes de mise au point (harnais de test,
      # debugger, dialogues natifs confirm()/prompt() inoperants sous WebKitGTK).
      - name: Front — garde
        run: ./scripts/guard.sh

      # Tous les modules, pas une liste : celle-ci avait pris du retard — cinq
      # fichiers sur une trentaine depuis le découpage du front —, et `check.sh`
      # comme le hook de pré-commit lintent « . » depuis la 0.6.2.
      - name: Front — lint (ESLint typé)
        working-directory: web
        run: npx eslint .

      # Le CSS vit dans index.html : stylelint le lit à travers postcss-html.
      - name: Front — lint CSS
        working-directory: web
        run: npx stylelint index.html

      # Fichiers jamais importés, exports jamais lus, dépendances inutilisées :
      # knip a vu deux modules décrochés que ni tsc ni ESLint ne voyaient.
      - name: Front — code mort (knip)
        working-directory: web
        run: npx knip

      - name: Front — typage
        working-directory: web
        run: npx tsc --noEmit

      - name: Front — tests
        working-directory: web
        run: npx vitest run

      - name: Front — build
        working-directory: web
        run: npx vite build

      # avash-ui déclare le sidecar RDP en ressource embarquée (externalBin) : son
      # binaire doit exister AVANT toute compilation, sinon le script de build de
      # Tauri échoue. binaries/ est ignoré par git — c'est un artefact.
      - name: Processus RDP (requis par avash-ui)
        run: |
          cargo build --release --manifest-path rdp-sidecar/Cargo.toml
          mkdir -p crates/avash-ui/binaries
          cp rdp-sidecar/target/release/avash-rdp \
             crates/avash-ui/binaries/avash-rdp-x86_64-unknown-linux-gnu

      # --- Rust : format et clippy avant les tests, l'echec est instantane ---
      - name: Rust — format
        run: cargo fmt --all --check

      - name: Rust — clippy (avertissements = erreurs)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Clippy ne compile qu'en debug : un bloc sous cfg(debug_assertions) peut
      # laisser une variable inutilisée en release sans que rien ne le signale.
      - name: Rust — clippy en profil release
        run: cargo clippy --workspace --release -- -D warnings

      - name: Rust — tests
        run: cargo test --workspace --all-targets

      # Le sidecar RDP est HORS du workspace : `--workspace` ne le voit pas, et
      # ce job se contentait jusqu'ici de le COMPILER. Ses tests — dont ceux du
      # TOFU de certificat, le garde-fou qui empêche d'accepter n'importe quel
      # serveur RDP — ne s'exécutaient donc nulle part. Ils passaient, mais
      # personne ne l'aurait su s'ils avaient cessé de passer.
      # Les paquets IronRDP portés déclaraient `test = false`, hérité de l'amont :
      # les deux lignes ci-dessous ne lançaient RIEN, et les quatorze tests qui
      # couvrent nos propres correctifs passaient pour verts sans jamais tourner.
      # Le manifeste est corrigé ; verifier-portes.sh compte ce qui s'exécute
      # réellement, faute de quoi la même panne serait de nouveau invisible.
      - name: Processus RDP — format, clippy, tests
        working-directory: rdp-sidecar
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          ./verifier-portes.sh

      # Absent jusqu'ici du CI, et le sidecar RDP n'était audité nulle part
      # alors qu'il est compilé et livré dans le bundle.
      - name: Rust — audit des dépendances
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny unsound --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0429
          cargo audit --deny unsound --ignore RUSTSEC-2023-0071 --file rdp-sidecar/Cargo.lock

      # cargo-audit ne voit que les vulnérabilités déclarées. cargo-deny ferme
      # trois autres portes que rien ne surveillait : une licence inattendue
      # arrivant par une dépendance transitive, une dépendance en joker qui rend
      # la construction imprévisible, une source hors du registre officiel.
      - name: Rust — licences, jokers et sources
        run: |
          cargo install cargo-deny --locked
          cargo deny check advisories licenses bans sources
          cargo deny --manifest-path rdp-sidecar/Cargo.toml check advisories licenses bans sources

      - name: Rust — build release
        run: cargo build --release -p avash-ui

  # Le cœur (crate avash) doit compiler ET PASSER SES TESTS sous Windows.
  #
  # Ce job est le garde-fou de la promesse « multi-plateforme ». Il a d'abord
  # été ajouté après la découverte que l'authentification par agent SSH
  # utilisait une API Unix seulement — toute compilation Windows était
  # impossible, et invisible depuis une machine Linux.
  #
  # Il se contentait ensuite d'un `cargo check` : aucun test ne s'exécutait sur
  # Windows. C'est l'angle mort qui a laissé passer l'absence de repli vers
  # `keyboard-interactive`, signalée par l'usage réel et non par nous. Les tests
  # d'intégration montent un vrai serveur SSH en mémoire : ils tournent aussi
  # bien ici, et couvrent l'authentification, le PTY, SFTP et les tunnels.
  windows-coeur:
    name: Cœur — tests Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Le front d'abord : `tauri::generate_context!()` exige `web/dist` à la
      # compilation d'avash-ui, tests compris. Sans lui, la macro panique
      # (« frontendDist … doesn't exist ») et le job échouait avant tout test.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Front (exigé par la compilation d'avash-ui)
        working-directory: web
        run: npm ci && npx vite build
      - name: cargo check (crate avash)
        run: cargo check -p avash --all-targets
      - name: cargo test (crate avash)
        run: cargo test -p avash --all-targets
      # Le processus RDP est lui aussi livré sous Windows.
      - name: Processus RDP — compilation et tests
        working-directory: rdp-sidecar
        run: |
          cargo check --all-targets
          cargo test

      # avash-ui n'était bâti QUE lors d'une release : tout le code spécifique
      # Windows — session_distante(), arguments_webview2(), les FFI user32 — n'était
      # jamais compilé ni testé par la CI. Une faute de frappe dans un extern ou un
      # #[link] cassé n'apparaissait qu'au moment de publier. On le compile et on le
      # teste ici. Le build-script de Tauri exige la présence du binaire du sidecar ;
      # un fichier vide suffit à un check/test (l'embarquage n'a lieu qu'au bundle).
      - name: Interface — compilation et tests (dont le code Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path crates/avash-ui/binaries | Out-Null
          New-Item -ItemType File -Force -Path crates/avash-ui/binaries/avash-rdp-x86_64-pc-windows-msvc.exe | Out-Null
          cargo check -p avash-ui --all-targets
          cargo test -p avash-ui --lib --bin avash-ui

  # Scénarios bout en bout sous Windows : la vraie application sur WebView2,
  # pilotée par le serveur WebDriver qu'elle embarque pour l'occasion (voir
  # l'étape de construction). Les quatre bogues Windows de l'été ont tous été
  # trouvés en publiant ; la suite Linux ne pouvait pas les voir. Sans sshd de
  # harnais ni serveur RDP ici : les scénarios sans serveur local, qui sont
  # déjà les plus nombreux.
  e2e-windows:
    name: E2E Windows (WebView2)
    runs-on: windows-latest
    # Une session WebDriver qui ne s'ouvre jamais laisserait le job tourner six
    # heures : on borne, et le journal devient lisible.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Dix minutes de compilation à chaque passage sinon : le cache ne se
          # sauvait qu'après un job vert, et ce job a mis du temps à le devenir.
          cache-on-failure: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Front (le binaire embarque web/dist)
        working-directory: web
        run: npm ci && npx vite build
      # Le build-script de Tauri exige le binaire du sidecar ; un fichier vide
      # suffit, les scénarios RDP ne tournent pas ici.
      #
      # `--features webdriver` : l'application embarque son serveur WebDriver.
      # Edge WebDriver ne lance plus une application WebView2 depuis sa version
      # 133 (« DevToolsActivePort file doesn't exist », chaque scénario mourait
      # après quatre minutes) ; le harnais lance donc l'application lui-même et
      # WebdriverIO lui parle en direct. Ce binaire ne quitte pas ce job.
      - name: Construire l'app (serveur WebDriver embarqué)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path crates/avash-ui/binaries | Out-Null
          New-Item -ItemType File -Force -Path crates/avash-ui/binaries/avash-rdp-x86_64-pc-windows-msvc.exe | Out-Null
          cargo build --release -p avash-ui --features webdriver
      - name: E2E — dépendances
        working-directory: e2e
        run: npm ci
      - name: E2E — scénarios sans serveur local
        working-directory: e2e
        run: npm test
        env:
          E2E_NO_RDP: "1"

  # macOS : la dernière plateforme majeure. Sans machine pour l'éprouver, la
  # chaîne vérifie au moins que tout compile et que le cœur passe ses tests là
  # aussi — le trousseau natif (keyring, dépôt Apple) et les chemins de fichiers
  # sont les points qui divergent le plus souvent.
  macos-coeur:
    name: macOS — tests et E2E (WKWebView)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Front (exigé par la compilation d'avash-ui)
        working-directory: web
        run: npm ci && npx vite build
      - name: cargo test (crate avash)
        run: cargo test -p avash --all-targets
      - name: Processus RDP — compilation et tests
        working-directory: rdp-sidecar
        run: |
          cargo check --all-targets
          cargo test
      - name: Interface — compilation et tests
        run: |
          mkdir -p crates/avash-ui/binaries
          touch crates/avash-ui/binaries/avash-rdp-aarch64-apple-darwin
          cargo check -p avash-ui --all-targets
          cargo test -p avash-ui --lib --bin avash-ui
      # Scénarios bout en bout sur WKWebView : macOS n'a aucun pilote WebDriver,
      # l'application embarque le sien (`--features webdriver`, comme sous
      # Windows) et le harnais la lance lui-même. Sans serveur local ici non
      # plus. C'est la première fois que l'interface est exercée sur macOS.
      - name: Construire l'app (serveur WebDriver embarqué)
        run: cargo build --release -p avash-ui --features webdriver
      - name: E2E — dépendances
        working-directory: e2e
        run: npm ci
      - name: E2E — scénarios sans serveur local
        working-directory: e2e
        run: npm test
        env:
          E2E_NO_RDP: "1"
          E2E_EMBARQUE: "1"

  e2e:
    name: E2E (app réelle, headless)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # webkit2gtk-driver fournit WebKitWebDriver ; xvfb pour le headless.
      - name: Dépendances système + WebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            webkit2gtk-driver xvfb

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: tauri-driver
        run: cargo install tauri-driver --locked

      # Même contrainte que dans le job « build » : avash-ui déclare le sidecar
      # RDP en ressource embarquée, son binaire doit exister avant compilation.
      - name: Construire l'app (le binaire embarque le front)
        run: |
          (cd web && npm ci && npx vite build)
          cargo build --release --manifest-path rdp-sidecar/Cargo.toml
          mkdir -p crates/avash-ui/binaries
          cp rdp-sidecar/target/release/avash-rdp \
             crates/avash-ui/binaries/avash-rdp-x86_64-unknown-linux-gnu
          cargo build --release -p avash-ui

      - name: E2E — dépendances
        working-directory: e2e
        run: npm ci

      # Ce code ne tourne que sur la machine de test, jamais chez l'utilisateur :
      # on ne bloque que sur « critique », comme check.sh — WebdriverIO 9 traîne
      # des avis « haute » sans correctif en amont.
      - name: E2E — audit des dépendances
        working-directory: e2e
        run: npm audit --audit-level=critical

      # Les serveurs locaux tournent ici aussi. Sept scénarios sur vingt et un
      # — connexion SSH réelle, SFTP, les trois RDP, les onglets mixtes,
      # « enregistrer puis connecter » — n'étaient joués qu'en local, alors que
      # ce sont ceux qui traversent réellement les protocoles. Le harnais monte
      # lui-même un sshd non-root (clé, port 2223) ; le serveur RDP de test se
      # construit ici, et son certificat auto-signé, non versionné, se génère.
      - name: Serveur RDP de test
        run: |
          cargo build --release --manifest-path test-rdp-server/Cargo.toml
          openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj "/CN=localhost" \
            -keyout test-rdp-server/key.pem -out test-rdp-server/cert.pem 2>/dev/null

      - name: E2E — suite complète (sshd et serveur RDP locaux compris)
        working-directory: e2e
        run: xvfb-run -a npm test

      # Passage à part : le service de comparaison ralentit chaque fichier de
      # scénarios, on ne le charge que pour celui-ci.
      - name: E2E — régression visuelle
        working-directory: e2e
        run: xvfb-run -a npx wdio run wdio.conf.js --spec specs/visuel.spec.js
        env:
          VISUEL: "1"

      # Régression visuelle : les captures produites (réelles et différences)
      # sont publiées quoi qu'il arrive. Pour rafraîchir les références après
      # un changement d'interface voulu : récupérer l'artefact « visuel »,
      # copier son dossier reference dans e2e/visuel/reference, commiter.
      - name: Captures de régression visuelle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visuel
          path: |
            e2e/visuel/reference
            e2e/.tmp/visuel
          if-no-files-found: ignore

  # Conformité RDP contre de VRAIS serveurs xrdp.
  #
  # Ce job existe parce que les trois défauts RDP de la version 0.3.3 — image
  # cisaillée, clavier en QWERTY, connexion suspendue sans fin — ont tous été
  # signalés par l'usage, et qu'AUCUN n'était visible depuis les tests. Les
  # tests unitaires vérifiaient nos fonctions, la suite bout en bout vérifiait
  # l'interface ; entre les deux se trouvait le seul endroit où ces défauts
  # vivaient, le dialogue réel avec un serveur RDP.
  #
  # XFCE et GNOME sont éprouvés tous les deux : ils ne dessinent pas pareil, et
  # c'est cette diversité qui fait sortir les défauts de décodage.
  conformite:
    name: Conformité (xrdp réels XFCE + GNOME, sshd PAM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Outils du détecteur d'image
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy python3-pil python3-websockets

      - name: Construire le processus RDP
        run: cargo build --release --manifest-path rdp-sidecar/Cargo.toml

      # docker est présent d'origine sur les exécuteurs ; parc-rdp.sh prend
      # podman s'il existe, docker sinon.
      - name: Démarrer le parc (XFCE, GNOME, sshd)
        run: ./scripts/parc-rdp.sh up tous

      - name: Conformité
        run: ./scripts/conformite.sh tous

      - name: Arrêter le parc
        if: always()
        run: ./scripts/parc-rdp.sh down
