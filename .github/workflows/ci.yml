name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Avash — lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri exige webkit2gtk et ses dependances systeme sur Linux.
      - name: Dépendances système Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # --- Front d'abord : le build Rust de avash-ui exige web/dist ---
      - name: Front — dépendances
        working-directory: web
        run: npm ci

      # Garde anti-etourderie : bloque les restes de mise au point (harnais de test,
      # debugger, dialogues natifs confirm()/prompt() inoperants sous WebKitGTK).
      - name: Front — garde
        run: ./scripts/guard.sh

      - name: Front — lint (ESLint typé)
        working-directory: web
        run: npx eslint main.ts filters.ts

      - name: Front — typage
        working-directory: web
        run: npx tsc --noEmit

      - name: Front — tests
        working-directory: web
        run: npx vitest run

      - name: Front — build
        working-directory: web
        run: npx vite build

      # --- Rust : format et clippy avant les tests, l'echec est instantane ---
      - name: Rust — format
        run: cargo fmt --all --check

      - name: Rust — clippy (avertissements = erreurs)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust — tests
        run: cargo test --workspace --all-targets

      - name: Rust — build release
        run: cargo build --release -p avash-ui

  e2e:
    name: E2E (app réelle, headless)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      # webkit2gtk-driver fournit WebKitWebDriver ; xvfb pour le headless.
      - name: Dépendances système + WebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            webkit2gtk-driver xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: tauri-driver
        run: cargo install tauri-driver --locked

      - name: Construire l'app (le binaire embarque le front)
        run: |
          (cd web && npm ci && npx vite build)
          cargo build --release -p avash-ui

      - name: E2E — dépendances
        working-directory: e2e
        run: npm ci

      # E2E_NO_RDP : on saute le scénario RDP (certs de test non versionnés,
      # handshake CredSSP peu adapté au headless). Les flux UI, eux, sont couverts.
      - name: E2E — suite (hors RDP)
        working-directory: e2e
        run: E2E_NO_RDP=1 xvfb-run -a npm test
