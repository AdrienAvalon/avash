name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Interface (avash-ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # avash-ui depend du coeur par chemin relatif (../avash) : sans ce
      # second checkout, la compilation echoue des la resolution des deps.
      - name: Récupérer le cœur avash
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/avash
          path: ../avash

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Tauri exige webkit2gtk et ses dependances systeme sur Linux.
      - name: Dépendances système Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Format
        run: cargo fmt --check

      - name: Clippy (avertissements = erreurs)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets
