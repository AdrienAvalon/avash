name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Avash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri exige webkit2gtk et ses dependances systeme sur Linux.
      - name: Dépendances système Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # --- Front d'abord : le build Rust de avash-ui exige web/dist ---
      - name: Front — dépendances
        working-directory: web
        run: npm ci

      - name: Front — typage
        working-directory: web
        run: npx tsc --noEmit

      - name: Front — tests
        working-directory: web
        run: npx vitest run

      - name: Front — build
        working-directory: web
        run: npx vite build

      # --- Rust : format et clippy avant les tests, l'echec est instantane ---
      - name: Rust — format
        run: cargo fmt --all --check

      - name: Rust — clippy (avertissements = erreurs)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust — tests
        run: cargo test --workspace --all-targets

      - name: Rust — build release
        run: cargo build --release -p avash-ui
