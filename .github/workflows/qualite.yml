name: Qualité

# Ce que la chaîne de chaque commit ne mesure pas : la couverture des tests et
# leur force par mutation, sur les modules de sécurité en priorité. Chaque
# lundi et à la demande ; les rapports sont des artefacts et le résumé du job.
# Les chiffres à retenir vont dans docs/qualite.md et docs/feuille-de-route.md
# à chaque version, à la main : une mesure sans lecture ne sert à rien.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  couverture:
    name: Couverture (cargo-llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: cargo-llvm-cov
      # avash-ui embarque web/dist à la compilation, et son build-script exige
      # le binaire du sidecar : un fichier vide suffit hors bundle.
      - name: Front et sidecar factice
        run: |
          (cd web && npm ci && npx vite build)
          mkdir -p crates/avash-ui/binaries
          : > crates/avash-ui/binaries/avash-rdp-x86_64-unknown-linux-gnu
      - name: Couverture de l'espace de travail
        run: |
          cargo llvm-cov --workspace --html --output-dir couverture/espace-de-travail
          {
            echo "## Couverture : espace de travail (cœur, interface)"
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Couverture du processus RDP
        working-directory: rdp-sidecar
        run: |
          cargo llvm-cov --html --output-dir ../couverture/processus-rdp
          {
            echo "## Couverture : processus RDP"
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: couverture
          path: couverture
          retention-days: 30

  mutation:
    name: Mutation (cargo-mutants, modules de sécurité)
    runs-on: ubuntu-latest
    # Chaque mutant rejoue les tests du cœur : c'est long par construction.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: cargo-mutants
      # Les modules qui décident de la sécurité : la session SSH (clés d'hôte,
      # agent), les clés, les secrets, l'écriture atomique et le parseur de
      # configuration (lib.rs). --in-place : le mode copie emporte le dossier
      # target entier à chaque mutant.
      - name: Mutants sur le cœur
        run: |
          # Les filtres se lisent depuis la racine de l'espace de travail
          # (`src/ssh.rs` ne sélectionne rien) : 264 mutants le 05/09/2026.
          cargo mutants -p avash --in-place --timeout 300 \
            -f crates/avash/src/ssh.rs -f crates/avash/src/keys.rs \
            -f crates/avash/src/secrets.rs -f crates/avash/src/lib.rs \
            -o mutants || true
          {
            echo "## Mutation : cœur (ssh.rs, keys.rs, secrets.rs, lib.rs)"
            echo '```'
            cat mutants/outcomes.json | python3 -c '
          import json, sys, collections
          d = json.load(sys.stdin)
          c = collections.Counter(o["summary"] for o in d["outcomes"])
          for k, v in sorted(c.items()): print(f"{k}: {v}")
          print()
          print("survivants :")
          for o in d["outcomes"]:
              if o["summary"] == "MissedMutant": print(" -", o["scenario"]["Mutant"]["function"]["function_name"], "@", o["scenario"]["Mutant"]["span"]["start"]["line"], ":", o["scenario"]["Mutant"]["replacement"])
          '
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants
          path: |
            mutants/outcomes.json
            mutants/missed.txt
            mutants/caught.txt
            mutants/timeout.txt
            mutants/unviable.txt
          retention-days: 30
