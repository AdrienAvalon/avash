name: Qualité

# Ce que la chaîne de chaque commit ne mesure pas : la couverture des tests et
# leur force par mutation, sur les modules de sécurité en priorité. Chaque
# lundi et à la demande ; les rapports sont des artefacts et le résumé du job.
# Les chiffres à retenir vont dans docs/qualite.md et docs/feuille-de-route.md
# à chaque version, à la main : une mesure sans lecture ne sert à rien.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Couverture réelle : tests unitaires ET suite bout en bout, sur des binaires
  # instrumentés (scripts/couverture.sh). Le premier relevé, unitaires seuls
  # (05/09/2026), donnait 76 % à l'espace de travail : les commandes Tauri
  # et la boucle du processus RDP, que seule la suite bout en bout traverse,
  # comptaient pour zéro. Ce job monte donc tout ce que le job E2E de ci.yml
  # monte : pilotes WebDriver, serveurs de test, sshd du harnais.
  couverture:
    name: Couverture (unitaires + bout en bout, cargo-llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dépendances système + WebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            webkit2gtk-driver xvfb socat
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: cargo-llvm-cov
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      # Le front que le binaire embarque, la suite, et les serveurs de test
      # (non instrumentés : ce sont des serveurs, pas le code mesuré). Le
      # certificat du serveur RDP de test n'est pas versionné.
      - name: Front, suite bout en bout, serveurs de test
        run: |
          (cd web && npm ci && npx vite build)
          (cd e2e && npm ci)
          cargo build --release --manifest-path test-rdp-server/Cargo.toml
          openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj "/CN=localhost" \
            -keyout test-rdp-server/key.pem -out test-rdp-server/cert.pem 2>/dev/null
          cargo build --release --manifest-path test-vnc-server/Cargo.toml
      - name: Couverture (binaires instrumentés, unitaires, suite bout en bout)
        run: scripts/couverture.sh couverture
      - name: Couverture du front (Vitest)
        working-directory: web
        run: npx vitest run --coverage --coverage.reporter=text --coverage.reporter=html --coverage.reportsDirectory=../couverture/front --silent | tee ../couverture/front.txt
      - name: Résumé
        run: |
          for f in espace-de-travail processus-rdp front; do
            {
              echo "## Couverture : $f"
              echo '```'
              cat "couverture/$f.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: couverture
          path: couverture
          retention-days: 30

  mutation:
    name: Mutation (cargo-mutants, modules de sécurité)
    runs-on: ubuntu-latest
    # Chaque mutant rejoue les tests du cœur : c'est long par construction.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: cargo-mutants
      # Les modules qui décident de la sécurité : la session SSH (clés d'hôte,
      # agent), les clés, les secrets, l'écriture atomique et le parseur de
      # configuration (lib.rs). --in-place : le mode copie emporte le dossier
      # target entier à chaque mutant.
      - name: Mutants sur le cœur
        run: |
          # Les filtres se lisent depuis la racine de l'espace de travail
          # (`src/ssh.rs` ne sélectionne rien) : 264 mutants le 05/09/2026.
          cargo mutants -p avash --in-place --timeout 300 \
            -f crates/avash/src/ssh.rs -f crates/avash/src/keys.rs \
            -f crates/avash/src/secrets.rs -f crates/avash/src/lib.rs \
            -o mutants || true
          {
            echo "## Mutation : cœur (ssh.rs, keys.rs, secrets.rs, lib.rs)"
            echo '```'
            # `-o mutants` écrit dans mutants/mutants.out/ : le premier passage
            # (05/09/2026, 264 mutants en deux heures) a fini sur un résumé
            # qui cherchait outcomes.json un cran trop haut.
            cat mutants/mutants.out/outcomes.json | python3 -c '
          import json, sys, collections
          d = json.load(sys.stdin)
          c = collections.Counter(o["summary"] for o in d["outcomes"])
          for k, v in sorted(c.items()): print(f"{k}: {v}")
          print()
          print("survivants :")
          for o in d["outcomes"]:
              if o["summary"] == "MissedMutant": print(" -", o["scenario"]["Mutant"]["function"]["function_name"], "@", o["scenario"]["Mutant"]["span"]["start"]["line"], ":", o["scenario"]["Mutant"]["replacement"])
          '
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants
          path: |
            mutants/mutants.out/outcomes.json
            mutants/mutants.out/missed.txt
            mutants/mutants.out/caught.txt
            mutants/mutants.out/timeout.txt
            mutants/mutants.out/unviable.txt
          retention-days: 30
