name: Sécurité

# Trois regards extérieurs, indépendants de nos propres vérifications :
# - CodeQL lit le code (Rust, TypeScript) à la recherche des motifs connus de
#   vulnérabilité, et publie ses constats dans l'onglet Security du dépôt ;
# - gitleaks fouille tout l'historique à la recherche de secrets — un jeton
#   collé dans un fichier ne doit jamais atteindre le dépôt ;
# - Scorecard de l'OpenSSF note la posture du dépôt (revues, épinglage,
#   permissions des workflows) et dit où elle est faible ;
# - le fuzzing (cargo-fuzz, nightly) secoue les parseurs du cœur — ce qui entre
#   depuis un fichier écrit par quelqu'un d'autre — et le décodeur ClearCodec
#   du canal graphique, 45 secondes par cible.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # chaque lundi : les règles évoluent, pas seulement le code

# Une poussée qui en suit une autre de près rend la précédente sans objet : on
# annule ce qui tourne encore pour la même branche, et les exécuteurs Windows et
# macOS — les plus rares — vont au dernier commit. Une exécution planifiée ou
# une PR a son propre groupe.
concurrency:
  group: securite-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions: read-all

jobs:
  codeql:
    name: CodeQL (${{ matrix.langage }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        langage: [rust, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.langage }}
          queries: security-and-quality
          config-file: ./.github/codeql/config.yml
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.langage }}

  secrets:
    name: Secrets dans l'historique (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Scorecard n'a pas d'alias de version majeure : le tag complet est requis,
      # épinglé sur son commit comme l'outil le recommande lui-même.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: scorecard.sarif

  fuzz:
    name: Fuzzing des parseurs (cargo-fuzz)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # Trouvé par l'audit du 7 septembre 2026 : le corpus enrichi par la
      # couverture (`fuzz/corpus`) était jeté à la fin du job. Il est ignoré par
      # git et `rust-cache` ne garde que `~/.cargo` et `target`, si bien que
      # l'exploration repartait des seules graines (1 à 7 par cible) à chaque
      # poussée et chaque lundi. On persiste le corpus entre exécutions : la clé
      # porte `run_id` (donc toujours un nouvel enregistrement en fin de job) et
      # `restore-keys` retrouve par préfixe le corpus du run précédent. Inutile
      # sur PR, qui ne fait que compiler les cibles.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: github.event_name != 'pull_request'
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ hashFiles('fuzz/seeds/**', 'fuzz/fuzz_targets/**') }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      # Trouvé par l'audit du 7 septembre 2026 : le job était sauté sur les PR
      # (`if: github.event_name != 'pull_request'`) et `check.sh` ne compile pas
      # le crate `fuzz` (hors espace de travail, nightly). Une PR qui renommait
      # un parseur du cœur ou changeait une signature utilisée par une cible
      # (p. ex. `avash::import::parse_reg_query`, `ClearCodecDecoder::decode`)
      # passait verte partout, puis ne cassait le job `fuzz` qu'au premier push
      # sur `main` après la fusion. Sur une PR on compile donc toutes les cibles
      # sans fuzzer : la rupture d'API est vue avant la fusion, sans le coût ni
      # le non-déterminisme d'une campagne.
      - name: Compilation des cibles (PR)
        if: github.event_name == 'pull_request'
        run: cargo +nightly fuzz build
        working-directory: fuzz
      # Sort en erreur au premier plantage ; l'entrée fautive est publiée pour
      # être rejouée en local (`cargo +nightly fuzz run <cible> <fichier>`).
      - name: Fuzz — 45 s par cible
        if: github.event_name != 'pull_request'
        run: DUREE=45 fuzz/fuzz.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-artefacts
          path: fuzz/artifacts
          if-no-files-found: ignore
