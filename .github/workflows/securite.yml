name: Sécurité

# Trois regards extérieurs, indépendants de nos propres vérifications :
# - CodeQL lit le code (Rust, TypeScript) à la recherche des motifs connus de
#   vulnérabilité, et publie ses constats dans l'onglet Security du dépôt ;
# - gitleaks fouille tout l'historique à la recherche de secrets — un jeton
#   collé dans un fichier ne doit jamais atteindre le dépôt ;
# - Scorecard de l'OpenSSF note la posture du dépôt (revues, épinglage,
#   permissions des workflows) et dit où elle est faible.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # chaque lundi : les règles évoluent, pas seulement le code

permissions: read-all

jobs:
  codeql:
    name: CodeQL (${{ matrix.langage }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        langage: [rust, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: ${{ matrix.langage }}
          queries: security-and-quality
          config-file: ./.github/codeql/config.yml
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: /language:${{ matrix.langage }}

  secrets:
    name: Secrets dans l'historique (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      # Scorecard n'a pas d'alias de version majeure : le tag complet est requis,
      # épinglé sur son commit comme l'outil le recommande lui-même.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: scorecard.sarif
