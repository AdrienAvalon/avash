name: Claude Code

# Claude répond aux mentions « @claude » dans les issues, les commentaires de
# PR et les revues : question sur le code, demande de correctif, résumé d'une
# PR. Installé par `/install-github-app` (PR #13), puis aligné sur les règles
# du dépôt : actions épinglées sur leur commit, permissions minimales, borne
# de durée. Le jeton est celui de l'abonnement Claude Code (CLAUDE_CODE_OAUTH_TOKEN),
# un secret du dépôt — jamais dans un fichier.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    # Seul un auteur qui a déjà des droits sur le dépôt fait agir Claude.
    # Trouvé par l'audit du 12 septembre 2026 (C-chaine-6) : la mention seule
    # suffisait à démarrer le job, pour n'importe quel inconnu ; le contrôle
    # des droits n'avait lieu que dans l'action. Une issue ouverte par un
    # inconnu puis assignée ne déclenche donc rien : commenter « @claude ».
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # lire les résultats de la chaîne sur une PR
    steps:
      # L'action installe sa propre authentification git et retire celle de
      # checkout (git-config.ts) : le jeton n'a pas à rester dans .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636 # v1.0.217
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Sans `prompt`, Claude suit la demande du commentaire qui le mentionne.
          # Options : https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
