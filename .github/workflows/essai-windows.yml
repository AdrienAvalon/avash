# Binaire Windows d'essai, à la demande.
#
# Pour éprouver un correctif sur une vraie machine Windows sans publier de
# version : mêmes étapes que le job Windows du workflow Release, mais rien
# n'est publié — ni release, ni manifeste de mise à jour — l'installeur est
# un simple artefact, gardé trois jours. Première utilité : vérifier sur le
# contrôleur de domaine du parc qu'un avash ouvert dans une session RDP ne
# perd plus de tuiles dans son canvas (2026-09-03).
#
# Aucune clé de signature ici. Jusqu'au 12 septembre 2026, ce job recevait la
# clé privée de la mise à jour automatique pour un .sig jeté aussitôt, dans
# l'environnement d'un build qui exécute vite, chaque build.rs et chaque macro
# procédurale (audit du 12 septembre 2026, C-chaine-1). Il construit désormais
# comme la release : createUpdaterArtifacts coupé, Tauri ne signe rien et ne
# réclame aucune clé. Garde : scripts/tests/release-cle-signature-hors-build.sh.
name: Essai Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: essai-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      # Sans cache, comme le job `build` de release.yml : cet installeur
      # s'installe sur de vraies machines (le contrôleur de domaine du parc),
      # et un cache d'Actions peut être écrit par tout code qui tourne dans un
      # job de main (audit du 27 novembre 2026, SE-1 ; garde
      # scripts/tests/release-construit-sans-cache.sh).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Front (le binaire embarque web/dist)
        working-directory: web
        run: npm ci && npx vite build

      - name: Processus RDP
        working-directory: rdp-sidecar
        run: cargo build --locked --release

      - name: Placer le sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path crates/avash-ui/binaries | Out-Null
          Copy-Item rdp-sidecar/target/release/avash-rdp.exe `
            crates/avash-ui/binaries/avash-rdp-x86_64-pc-windows-msvc.exe

      # Version exacte, la même que release.yml (garde ci-outils-epingles.sh),
      # installée dans un dossier à elle et appelée par ce chemin, comme dans
      # release.yml (SE-1).
      - name: Outil Tauri
        shell: bash
        run: cargo install tauri-cli --version 2.11.4 --locked --root "$RUNNER_TEMP/outil-tauri"

      # shell bash : le JSON de --config passe tel quel, sans les règles de
      # guillemets de PowerShell. `-- --locked` va à cargo.
      - name: Bundle Tauri
        working-directory: crates/avash-ui
        shell: bash
        run: |
          "$RUNNER_TEMP/outil-tauri/bin/cargo-tauri" build --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked

      # Même garde que la publication (SE-2).
      - name: Aucun serveur WebDriver embarqué
        shell: bash
        run: bash scripts/verifier-sans-webdriver.sh target/release/avash-ui.exe

      - name: Installeur d'essai
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avash-essai-windows-${{ github.sha }}
          path: target/release/bundle/nsis/*-setup.exe
          retention-days: 3
          if-no-files-found: error
