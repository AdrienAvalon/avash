name: Release

# Publie les binaires pour Linux et Windows quand un tag v* est poussé.
# Chaque plateforme construit d'abord le processus RDP (rdp-sidecar, hors
# workspace) puis le place dans binaries/ sous le nom attendu par Tauri
# (externalBin ajoute automatiquement le triplet de la cible).
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # permet un essai manuel sans créer de tag

permissions:
  contents: write     # créer la release et y joindre les binaires
  id-token: write     # jeton OIDC : prouve à Sigstore que la signature vient de ce workflow
  attestations: write # enregistrer l'attestation de provenance

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            nom: linux
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            nom: windows
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.nom }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Front (le binaire embarque web/dist)
        working-directory: web
        run: npm ci && npx vite build

      # Le sidecar RDP a son propre workspace : il se construit séparément.
      - name: Processus RDP
        working-directory: rdp-sidecar
        run: cargo build --release

      - name: Placer le sidecar (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p crates/avash-ui/binaries
          cp rdp-sidecar/target/release/avash-rdp \
             crates/avash-ui/binaries/avash-rdp-${{ matrix.triple }}

      - name: Placer le sidecar (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path crates/avash-ui/binaries | Out-Null
          Copy-Item rdp-sidecar/target/release/avash-rdp.exe `
            crates/avash-ui/binaries/avash-rdp-${{ matrix.triple }}.exe

      - name: Outil Tauri
        run: cargo install tauri-cli --version "^2" --locked

      # Depuis crates/avash-ui : la commande de pré-build de tauri.conf.json
      # utilise un chemin relatif (../../web) qui ne se résout correctement que
      # depuis ce répertoire. NO_STRIP : linuxdeploy échoue à dépouiller les
      # binaires récents (.relr.dyn).
      # TAURI_SIGNING_PRIVATE_KEY : sans elle, Tauri ne produit aucun fichier .sig
      # et la mise à jour automatique ne peut pas vérifier ce qu'elle télécharge.
      - name: Bundles Tauri
        working-directory: crates/avash-ui
        run: cargo tauri build
        env:
          NO_STRIP: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Version portable Windows : l'application et son processus RDP côte à côte,
      # sans installation ni écriture dans la base de registre. Utile sur un poste
      # où l'on ne peut rien installer. Nécessite WebView2, présent d'origine sur
      # Windows 11 et sur Windows 10 à jour.
      - name: Version portable (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $dossier = "portable/avash-$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Force -Path $dossier | Out-Null
          Copy-Item target/release/avash-ui.exe "$dossier/avash.exe"
          Copy-Item crates/avash-ui/binaries/avash-rdp-${{ matrix.triple }}.exe `
                    "$dossier/avash-rdp.exe"
          Copy-Item LICENSE "$dossier/LICENSE.txt"
          @"
          avash — version portable

          Lancer avash.exe. Aucune installation, rien n'est ecrit dans la base de
          registre. Gardez avash-rdp.exe dans le meme dossier : c'est le processus
          qui assure les connexions RDP.

          Les mots de passe restent confies au gestionnaire d'identifiants de
          Windows, jamais ecrits dans ce dossier.
          "@ | Set-Content "$dossier/LISEZ-MOI.txt"
          Compress-Archive -Path $dossier -DestinationPath "portable/avash-$env:VERSION-windows-x64.zip"
        env:
          VERSION: "0.4.3"

      - name: Publier les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: avash-${{ matrix.nom }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            portable/*.zip
          if-no-files-found: warn

  publier:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artefacts }
      # Manifeste interrogé par l'application (plugin updater de Tauri). Sans ce
      # fichier, l'endpoint renvoie 404 et « vérifier les mises à jour » échoue.
      - name: Manifeste de mise à jour (latest.json)
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          sig() { find artefacts -name "$1" -print -quit | xargs -r cat; }
          # Sans signature, le manifeste serait vide et la mise à jour échouerait
          # sans rien dire. On préfère faire échouer la publication, visiblement.
          if [ -z "$(sig '*.AppImage.sig')" ] && [ -z "$(sig '*-setup.exe.sig')" ]; then
            echo "::error::Aucune signature trouvée. Le secret TAURI_SIGNING_PRIVATE_KEY" \
                 "est-il défini sur le dépôt ? Sans lui, la mise à jour automatique" \
                 "ne peut pas vérifier ce qu'elle télécharge."
            exit 1
          fi
          python3 - "$version" "$base" "$(sig '*.AppImage.sig')" "$(sig '*-setup.exe.sig')" <<'PY' > latest.json
          import json, sys, datetime
          version, base, sig_linux, sig_win = sys.argv[1:5]
          plateformes = {}
          if sig_linux:
              plateformes["linux-x86_64"] = {
                  "signature": sig_linux,
                  "url": f"{base}/Avash_{version}_amd64.AppImage",
              }
          if sig_win:
              plateformes["windows-x86_64"] = {
                  "signature": sig_win,
                  "url": f"{base}/Avash_{version}_x64-setup.exe",
              }
          json.dump({
              "version": version,
              "notes": f"avash {version} — voir le journal des modifications.",
              "pub_date": datetime.datetime.now(datetime.UTC).isoformat().replace("+00:00", "Z"),
              "platforms": plateformes,
          }, sys.stdout, ensure_ascii=False, indent=2)
          PY
          cat latest.json

      - name: Empreintes SHA256
        run: |
          find artefacts -type f \( -name '*.AppImage' -o -name '*.exe' -o -name '*.zip' \) -print0 \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      # Attestation de provenance : preuve cryptographique (Sigstore) que ces
      # binaires ont bien été produits par ce dépôt, à ce commit, par ce
      # workflow — et non substitués en chemin. À vérifier côté utilisateur avec
      #   gh attestation verify <fichier> --repo AdrienAvalon/avash
      # Ce n'est PAS une signature Authenticode : elle ne lève pas
      # l'avertissement de Windows, qui exige un certificat d'autorité.
      - name: Attester la provenance des binaires
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artefacts/**/*.AppImage
            artefacts/**/*.exe
            artefacts/**/*.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artefacts/**/*.AppImage
            artefacts/**/*.exe
            artefacts/**/*.zip
            artefacts/**/*.sig
            latest.json
            SHA256SUMS
          generate_release_notes: true
