name: Release

# Publie les binaires pour Linux, Windows et macOS quand un tag v* est poussé.
# Chaque plateforme construit d'abord le processus RDP (rdp-sidecar, hors
# workspace) puis le place dans binaries/ sous le nom attendu par Tauri
# (externalBin ajoute automatiquement le triplet de la cible).
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # permet un essai manuel sans créer de tag

# Par défaut, lecture seule ; seul le job qui publie reçoit les droits d'écrire
# (release, attestation), pas les trois jobs de construction.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            nom: linux
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            nom: windows
          - os: macos-latest
            triple: aarch64-apple-darwin
            nom: macos
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.nom }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dépendances système (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Le sidecar RDP est hors espace de travail : sans le nommer,
          # rust-cache ne cache que `./target` et recompile IronRDP à chaque
          # passage (audit du 8 septembre 2026). `.` reste listé, sinon on perd
          # le cache racine.
          workspaces: |
            .
            rdp-sidecar

      - name: Front (le binaire embarque web/dist)
        working-directory: web
        run: npm ci && npx vite build

      # Le sidecar RDP a son propre workspace : il se construit séparément.
      - name: Processus RDP
        working-directory: rdp-sidecar
        run: cargo build --release

      - name: Placer le sidecar (Linux, macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p crates/avash-ui/binaries
          cp rdp-sidecar/target/release/avash-rdp \
             crates/avash-ui/binaries/avash-rdp-${{ matrix.triple }}

      - name: Placer le sidecar (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path crates/avash-ui/binaries | Out-Null
          Copy-Item rdp-sidecar/target/release/avash-rdp.exe `
            crates/avash-ui/binaries/avash-rdp-${{ matrix.triple }}.exe

      - name: Outil Tauri
        run: cargo install tauri-cli --version "^2" --locked

      # Depuis crates/avash-ui : la commande de pré-build de tauri.conf.json
      # utilise un chemin relatif (../../web) qui ne se résout correctement que
      # depuis ce répertoire. NO_STRIP : linuxdeploy échoue à dépouiller les
      # binaires récents (.relr.dyn).
      # TAURI_SIGNING_PRIVATE_KEY : sans elle, Tauri ne produit aucun fichier .sig
      # et la mise à jour automatique ne peut pas vérifier ce qu'elle télécharge.
      # macOS : l'image disque et l'archive .app.tar.gz que la mise à jour
      # automatique télécharge. Sans identité de développeur Apple, rien n'est
      # notarisé : Gatekeeper demande un clic droit → Ouvrir au premier lancement.
      - name: Bundles Tauri
        working-directory: crates/avash-ui
        run: cargo tauri build ${{ matrix.os == 'macos-latest' && '--bundles app,dmg' || '' }}
        env:
          NO_STRIP: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Version portable Windows : l'application et son processus RDP côte à côte,
      # sans installation ni écriture dans la base de registre. Utile sur un poste
      # où l'on ne peut rien installer. Nécessite WebView2, présent d'origine sur
      # Windows 11 et sur Windows 10 à jour.
      - name: Version portable (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Version dérivée du tag (v0.9.2 -> 0.9.2), comme les jobs bash plus
          # bas : trouvé par l'audit du 8 septembre 2026, elle était codée en dur
          # dans un `env:` et pouvait diverger du tag publié.
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          $dossier = "portable/avash-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $dossier | Out-Null
          Copy-Item target/release/avash-ui.exe "$dossier/avash.exe"
          Copy-Item crates/avash-ui/binaries/avash-rdp-${{ matrix.triple }}.exe `
                    "$dossier/avash-rdp.exe"
          Copy-Item LICENSE "$dossier/LICENSE.txt"
          @"
          avash — version portable

          Lancer avash.exe. Aucune installation, rien n'est ecrit dans la base de
          registre. Gardez avash-rdp.exe dans le meme dossier : c'est le processus
          qui assure les connexions RDP.

          Les mots de passe restent confies au gestionnaire d'identifiants de
          Windows, jamais ecrits dans ce dossier.
          "@ | Set-Content "$dossier/LISEZ-MOI.txt"
          Compress-Archive -Path $dossier -DestinationPath "portable/avash-$version-windows-x64.zip"

      - name: Publier les artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avash-${{ matrix.nom }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/deb/*.deb
            target/release/bundle/deb/*.deb.sig
            target/release/bundle/rpm/*.rpm
            target/release/bundle/rpm/*.rpm.sig
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
            portable/*.zip
          if-no-files-found: warn

  # La publication attend la chaîne de sécurité. Trouvé le 8 septembre 2026 : le
  # tag déclenchait Release indépendamment du workflow Sécurité (qui, lui, suit
  # la poussée sur main) ; la 0.10.0 a donc été publiée pendant que le fuzzing
  # et gitleaks ROUGISSAIENT sur ce même commit, et il a fallu une 0.10.1. On
  # rejoue ici, avant de publier, les deux contrôles rapides qui ont mordu :
  # les secrets dans l'historique et une campagne de fuzz sur TOUTES les cibles
  # (fuzz.sh ne s'arrête plus à la première qui plante). CodeQL, long et déjà
  # planifié, reste au workflow Sécurité.
  securite:
    name: Sécurité avant publication (gitleaks, fuzz)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Secrets dans l'historique (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # Corpus enrichi par les campagnes précédentes (lecture seule ici : la
      # clé n'est jamais nouvelle, seul `restore-keys` joue).
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: fuzz/corpus
          key: fuzz-corpus-release-${{ github.sha }}
          restore-keys: fuzz-corpus-
      - name: Fuzz — 30 s par cible, toutes les cibles
        run: DUREE=30 fuzz/fuzz.sh

  publier:
    needs: [build, securite]
    runs-on: ubuntu-latest
    # L'événement autant que la référence. Trouvé par l'audit du 9 septembre
    # 2026 : `workflow_dispatch` est là pour ESSAYER un build sans créer de tag,
    # mais le bouton « Run workflow » laisse choisir n'importe quelle référence,
    # tag compris. Sur la seule condition de référence, un essai manuel lancé
    # sur un tag déjà publié republiait pour de bon : artefacts téléversés et
    # `latest.json` signé réécrit sous les utilisateurs.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write     # créer la release et y joindre les binaires
      id-token: write     # jeton OIDC : prouve à Sigstore que la signature vient de ce workflow
      attestations: write # enregistrer l'attestation de provenance
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { path: artefacts }
      # Manifeste interrogé par l'application (plugin updater de Tauri). Sans ce
      # fichier, l'endpoint renvoie 404 et « vérifier les mises à jour » échoue.
      - name: Manifeste de mise à jour (latest.json)
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          sig() { find artefacts -name "$1" -print -quit | xargs -r cat; }
          present() { [ -n "$(find artefacts -name "$1" -print -quit)" ]; }
          # Sans signature, le manifeste serait vide et la mise à jour échouerait
          # sans rien dire. On préfère faire échouer la publication, visiblement.
          if [ -z "$(sig '*.AppImage.sig')" ] && [ -z "$(sig '*-setup.exe.sig')" ]; then
            echo "::error::Aucune signature trouvée. Le secret TAURI_SIGNING_PRIVATE_KEY" \
                 "est-il défini sur le dépôt ? Sans lui, la mise à jour automatique" \
                 "ne peut pas vérifier ce qu'elle télécharge."
            exit 1
          fi
          # Trouvé par l'audit du 7 septembre 2026 : tauri-cli signe aussi les
          # paquets .deb et .rpm (createUpdaterArtifacts, bundle.rs sign_updaters).
          # Le client d'une installation deb/rpm interroge linux-x86_64-deb /
          # linux-x86_64-rpm ; sans ces entrées il se rabattait sur l'AppImage et
          # échouait après l'avoir téléchargée (« invalid updater format »). On
          # publie donc les cibles natives. Un paquet présent sans sa signature
          # signale une clé absente : mieux vaut échouer que proposer une mise à
          # jour deb/rpm impossible à vérifier.
          for cible in deb rpm; do
            if present "*.$cible" && [ -z "$(sig "*.$cible.sig")" ]; then
              echo "::error::Un paquet .$cible est présent sans sa signature" \
                   "(*.$cible.sig). tauri-cli devrait la produire quand" \
                   "createUpdaterArtifacts est vrai et TAURI_SIGNING_PRIVATE_KEY" \
                   "défini. Publication interrompue."
              exit 1
            fi
          done
          python3 - "$version" "$base" "$(sig '*.AppImage.sig')" "$(sig '*-setup.exe.sig')" "$(sig '*.app.tar.gz.sig')" "$(sig '*.deb.sig')" "$(sig '*.rpm.sig')" <<'PY' > latest.json
          import json, sys, datetime
          version, base, sig_linux, sig_win, sig_mac, sig_deb, sig_rpm = sys.argv[1:8]
          plateformes = {}
          if sig_linux:
              plateformes["linux-x86_64"] = {
                  "signature": sig_linux,
                  "url": f"{base}/Avash_{version}_amd64.AppImage",
              }
          # Cibles natives du gestionnaire de paquets : le client deb/rpm les
          # préfère au repli linux-x86_64 (dpkg -i / rpm -U remplacent proprement
          # le paquet installé, là où l'AppImage désynchroniserait le gestionnaire).
          if sig_deb:
              plateformes["linux-x86_64-deb"] = {
                  "signature": sig_deb,
                  "url": f"{base}/Avash_{version}_amd64.deb",
              }
          if sig_rpm:
              plateformes["linux-x86_64-rpm"] = {
                  "signature": sig_rpm,
                  "url": f"{base}/Avash-{version}-1.x86_64.rpm",
              }
          if sig_win:
              plateformes["windows-x86_64"] = {
                  "signature": sig_win,
                  "url": f"{base}/Avash_{version}_x64-setup.exe",
              }
          if sig_mac:
              plateformes["darwin-aarch64"] = {
                  "signature": sig_mac,
                  "url": f"{base}/Avash.app.tar.gz",
              }
          json.dump({
              "version": version,
              "notes": f"avash {version} — voir le journal des modifications.",
              "pub_date": datetime.datetime.now(datetime.UTC).isoformat().replace("+00:00", "Z"),
              "platforms": plateformes,
          }, sys.stdout, ensure_ascii=False, indent=2)
          PY
          cat latest.json

      # Les sources servent deux fois : la nomenclature logicielle est
      # calculée dessus, et les notes de la release sont lues dans le CHANGELOG.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source

      # Nomenclature logicielle (SBOM) au format SPDX : la liste exacte des
      # bibliothèques embarquées, lue dans les fichiers de verrouillage de
      # l'espace de travail, du processus RDP et du front. Les arbres qui ne
      # sont pas livrés (serveurs de test, fuzzing, suite bout en bout) en sont
      # exclus. Ce que Cargo.lock ne distingue pas, le SBOM ne le distingue pas
      # non plus : les dépendances de développement des crates livrées y
      # figurent.
      - name: Nomenclature logicielle (SBOM)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: source
          format: spdx-json
          output-file: avash-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          config: source/.syft.yaml

      # Chaque ligne porte le seul nom du fichier, pas son chemin dans la
      # chaîne (`artefacts/avash-linux/target/…`) : `sha256sum -c SHA256SUMS`
      # depuis le dossier de téléchargement, comme le README le promet, ne
      # trouvait aucun fichier (constaté sur la 0.7.1).
      - name: Empreintes SHA256
        run: |
          : > SHA256SUMS
          find artefacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.app.tar.gz' \) -print0 \
            | while IFS= read -r -d '' f; do
                (cd "$(dirname "$f")" && sha256sum "$(basename "$f")")
              done >> SHA256SUMS
          sha256sum avash-*.spdx.json >> SHA256SUMS
          cat SHA256SUMS
      # Attestation de provenance : preuve cryptographique (Sigstore) que ces
      # binaires ont bien été produits par ce dépôt, à ce commit, par ce
      # workflow — et non substitués en chemin. À vérifier côté utilisateur avec
      #   gh attestation verify <fichier> --repo AdrienAvalon/avash
      # Ce n'est PAS une signature Authenticode : elle ne lève pas
      # l'avertissement de Windows, qui exige un certificat d'autorité.
      - name: Attester la provenance des binaires
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artefacts/**/*.AppImage
            artefacts/**/*.deb
            artefacts/**/*.rpm
            artefacts/**/*.exe
            artefacts/**/*.zip
            artefacts/**/*.dmg
            artefacts/**/*.app.tar.gz

      # Le lot Sigstore de cette attestation est joint à la release sous le
      # nom que les outils reconnaissent (`.intoto.jsonl`). L'attestation vit
      # déjà dans l'API de GitHub, mais un fichier à côté des binaires se
      # vérifie hors ligne (`gh attestation verify --bundle`), et le Scorecard
      # de l'OpenSSF ne comptait aucune provenance sans lui (8/10).
      # Les valeurs passent par l'environnement, jamais interpolées dans le
      # script : un nom de tag forgé ne doit pas devenir une commande.
      - name: Joindre le lot de provenance à la release
        env:
          LOT: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$LOT" "artefacts/avash-${GITHUB_REF_NAME}.intoto.jsonl"

      # La nomenclature est attestée à son tour, liée aux binaires : quelqu'un
      # peut vérifier que ce SBOM est bien celui de ces fichiers, et non un
      # document déposé après coup (gh attestation verify --predicate-type
      # https://spdx.dev/Document/v2.3 <fichier> --repo AdrienAvalon/avash).
      - name: Attester la nomenclature logicielle
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            artefacts/**/*.AppImage
            artefacts/**/*.deb
            artefacts/**/*.rpm
            artefacts/**/*.exe
            artefacts/**/*.zip
            artefacts/**/*.dmg
            artefacts/**/*.app.tar.gz
          sbom-path: avash-${{ github.ref_name }}.spdx.json

      # Les notes de la release sont la section du CHANGELOG de cette version,
      # telle quelle : c'est ce que voient les visiteurs de la page des
      # releases et le courriel des abonnés, et jusqu'ici la page était vide
      # sous la liste des fichiers. Une section absente fait échouer la
      # publication plutôt que de publier sans un mot.
      - name: Notes de la release depuis le CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { dedans = 1; next }
            dedans && /^## \[/ { exit }
            dedans { print }
          ' source/CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::Aucune section [$version] dans CHANGELOG.md : la release aurait des notes vides."
            exit 1
          fi
          {
            echo "## Avash $version"
            echo
            cat notes.md
            echo
            echo "---"
            echo
            echo "Vérifier un fichier téléchargé : \`sha256sum -c SHA256SUMS\` depuis le dossier de téléchargement, et \`gh attestation verify <fichier> --repo ${GITHUB_REPOSITORY}\` pour sa provenance. La nomenclature logicielle (SBOM, SPDX) est jointe et attestée elle aussi. Mise à jour automatique depuis une version installée : pastille de version, « vérifier les mises à jour »."
          } > notes-release.md
          cat notes-release.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Avash ${{ github.ref_name }}
          body_path: notes-release.md
          # Un seul motif pour les signatures : `*.app.tar.gz.sig` en plus de
          # `*.sig` faisait téléverser deux fois Avash.app.tar.gz.sig, et la
          # seconde copie, en « écrasement », tombait sur un fichier que la
          # première venait de remplacer (« Not Found », release 0.8.0 restée
          # en brouillon sans cette signature, terminée à la main). Ce
          # commentaire est au-dessus de `files:` et non dedans : dans un bloc
          # `|`, une ligne `#` fait partie de la valeur (audit du 8 sept. 2026).
          files: |
            artefacts/**/*.AppImage
            artefacts/**/*.deb
            artefacts/**/*.rpm
            artefacts/**/*.exe
            artefacts/**/*.zip
            artefacts/**/*.dmg
            artefacts/**/*.app.tar.gz
            artefacts/**/*.sig
            artefacts/**/*.intoto.jsonl
            latest.json
            SHA256SUMS
            avash-*.spdx.json
          generate_release_notes: true
