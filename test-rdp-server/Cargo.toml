[package]
name = "test-rdp-server"
version = "0.1.0"
edition = "2021"
# Serveur de test, pas bibliothèque : rien n'est publié sur crates.io. Le dire
# empêche une publication par mégarde, comme les cinq autres manifestes du dépôt.
# Trouvé par l'audit du 8 septembre 2026 : ce manifeste était le seul sans
# publish = false ni licence, alors qu'il embarque du code AGPL du dépôt et une
# copie modifiée d'ironrdp-server (dont la licence MIT OR Apache-2.0 du vendor/
# reste distincte et ne qualifie pas ce paquet-ci).
publish = false
description = "Avash — serveur RDP de test pour la suite bout en bout"
license = "AGPL-3.0-or-later"

[dependencies]
# `rdpdr` et `svc` : le côté serveur de la redirection de lecteur (MS-RDPEFS),
# joué par src/rdpdr/ pour que la suite bout en bout vérifie le lecteur que le
# sidecar annonce.
ironrdp = { version = "0.17", features = ["server", "cliprdr", "rdpsnd", "connector", "rdpdr", "svc"] }
anyhow = "1"
async-trait = "0.1"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pico-args = "0.5"
opus2 = "0.4.0"
# Empreinte du fichier lu sur le lecteur redirigé, imprimée pour que le
# scénario la compare à celle du fichier du poste.
sha2 = "0.11"

# ironrdp-server 0.13.0 n'offre aucun point d'attache pour un canal statique
# autre que cliprdr, rdpsnd et drdynvc, attachés en dur. La copie ajoute une
# fabrique de canal, par laquelle passe rdpdr. Voir vendor/README.md.
[patch.crates-io]
ironrdp-server = { path = "vendor/ironrdp-server" }

# Politique de sûreté commune au processus RDP et aux serveurs de test (audit
# du 12 septembre 2026, unsafe.md) : ce paquet n'hérite de rien, l'espace de
# travail ne le couvre pas. Aucun `unsafe` ici hors de `vendor/` (dont les
# paquets gardent leurs propres réglages) : ces lints ne coûtent rien et
# signalent le premier qui arriverait sans justification.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
deprecated_safe_2024 = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
