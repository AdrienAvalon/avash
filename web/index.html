<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avash 😼</title>
  <style>
    :root {
      --bg: #0f1117;
      --bg-soft: #161a23;
      --card: #1c212e;
      --border: #2a3040;
      --text: #e6e9f0;
      --text-dim: #8b93a7;
      --accent: #7c6cf5;
      --accent-glow: rgba(124, 108, 245, .35);
      --ok: #3fd68f;
      --warn: #f5b652;
      --err: #f56a6a;
      --mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .app { display: flex; height: 100vh; }

    /* ===== Sidebar ===== */
    .sidebar {
      width: 260px; min-width: 220px;
      background: var(--bg-soft);
      border-right: 1px solid var(--border, #232838);
      display: flex; flex-direction: column;
    }
    .brand {
      padding: 16px 18px 12px;
      display: flex; align-items: center; gap: 8px;
      font-weight: 700; font-size: 15px; letter-spacing: .3px;
    }
    .brand .mascot { font-size: 18px; }
    .brand .ver { margin-left: auto; color: var(--text-dim); font-size: 11px; font-weight: 400; }
    .search-wrap { padding: 0 12px 10px; position: relative; }
    .search {
      width: 100%; padding: 9px 12px 9px 32px;
      background: var(--card); border: 1px solid var(--border, #2a3040);
      border-radius: 9px; color: var(--text); font-size: 13px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .search-wrap::before {
      content: "⌕"; position: absolute; left: 11px; top: 9px;
      color: var(--text-dim); font-size: 15px;
    }
    .host-list { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
    .host {
      padding: 10px 12px; border-radius: 9px; cursor: pointer;
      display: flex; align-items: center; gap: 10px;
      transition: background .12s;
      margin-bottom: 2px;
    }
    .host:hover { background: rgba(124, 108, 245, .09); }
    .host.selected { background: rgba(124, 108, 245, .16); }
    .host .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-dim); opacity: .5; flex-shrink: 0;
      transition: background .2s, opacity .2s;
    }
    .host .dot.ok { background: var(--ok); opacity: 1; box-shadow: 0 0 6px var(--ok); }
    .host .dot.err { background: var(--err); opacity: 1; }
    .host .info { min-width: 0; }
    .host .alias { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .host .meta { font-size: 11px; color: var(--text-dim); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .footer { padding: 10px 14px; border-top: 1px solid var(--border, #2a3040); font-size: 11px; color: var(--text-dim); display: flex; justify-content: space-between; }

    /* ===== Main ===== */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .tabs {
      display: flex; align-items: center; gap: 4px;
      background: var(--bg-soft); border-bottom: 1px solid var(--border, #2a3040);
      padding: 6px 10px;
    }
    .tab {
      padding: 6px 14px; border-radius: 7px; font-size: 12.5px;
      background: transparent; color: var(--text-dim); cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      border: 1px solid transparent; transition: all .15s;
    }
    .tab.active { background: var(--card); color: var(--text); border-color: var(--border, #2a3040); }
    .tab .close { opacity: .5; font-size: 11px; cursor: pointer; }
    .tab .close:hover { opacity: 1; }
    .terminal-zone { flex: 1; position: relative; display: flex; }
    .terminal-zone > #terminal { flex: 1; position: relative; min-width: 0; }
    .xterm-container { display: block; }

    /* ===== Panneau SFTP ===== */
    .sftp-panel {
      width: 0; overflow: hidden; transition: width .18s ease;
      background: var(--bg-soft); border-left: 1px solid var(--border, #2a3040);
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .sftp-panel.open { width: 300px; }
    .sftp-head {
      padding: 10px 12px; display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--border, #2a3040); font-size: 12.5px;
    }
    .sftp-path {
      flex: 1; min-width: 0; font-family: var(--mono); font-size: 11.5px;
      color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer;
    }
    .sftp-path:hover { color: var(--text); }
    .sftp-list { flex: 1; overflow-y: auto; padding: 6px; user-select: none; }
    .sftp-entry {
      padding: 7px 10px; border-radius: 7px; cursor: pointer; font-size: 12.5px;
      display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden;
    }
    .sftp-entry:hover { background: rgba(124,108,245,.12); }
    .sftp-entry .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .sftp-entry .sz { font-size: 10.5px; color: var(--text-dim); font-family: var(--mono); }
    .sftp-entry.dir .nm { color: var(--accent); font-weight: 600; }
    .sftp-foot {
      padding: 8px 12px; border-top: 1px solid var(--border, #2a3040);
      display: flex; gap: 8px;
    }
    .btn-mini {
      flex: 1; padding: 7px 0; border-radius: 7px; border: 1px solid var(--border, #2a3040);
      background: var(--card); color: var(--text); font-size: 12px; cursor: pointer; text-align: center;
    }
    .btn-mini:hover { border-color: var(--accent); }
    .sftp-status { padding: 4px 12px 8px; font-size: 10.5px; color: var(--text-dim); font-family: var(--mono); }
    .xterm, .xterm .xterm-screen { height: 100%; }
    .terminal-empty {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; color: var(--text-dim);
    }
    .terminal-empty .big { font-size: 42px; }
    .terminal-empty .hint { font-size: 13px; }
    .terminal-empty kbd {
      background: var(--card); border: 1px solid var(--border, #2a3040);
      border-radius: 5px; padding: 1px 7px; font-family: var(--mono); font-size: 12px;
    }

    /* ===== Command palette ===== */
    .palette-backdrop {
      position: fixed; inset: 0; background: rgba(8, 10, 16, .55);
      backdrop-filter: blur(3px); display: none; z-index: 50;
      align-items: flex-start; justify-content: center; padding-top: 12vh;
    }
    .palette-backdrop.open { display: flex; }
    .palette {
      width: min(560px, 90vw); background: var(--card);
      border: 1px solid var(--border, #2a3040); border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0,0,0,.5);
      overflow: hidden;
      animation: pop .12s ease-out;
    }
    @keyframes pop { from { transform: scale(.98) translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
    .palette input {
      width: 100%; padding: 15px 18px; background: transparent; border: none;
      outline: none; color: var(--text); font-size: 15px;
      border-bottom: 1px solid var(--border, #2a3040);
    }
    .palette .results { max-height: 320px; overflow-y: auto; padding: 6px; }
    .palette .item {
      padding: 10px 14px; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; gap: 10px; font-size: 13.5px;
    }
    .palette .item:hover, .palette .item.hl { background: rgba(124,108,245,.15); }
    .palette .item .sub { margin-left: auto; font-size: 11px; color: var(--text-dim); font-family: var(--mono); }
    .palette .empty { padding: 18px; text-align: center; color: var(--text-dim); font-size: 13px; }
  
      /* --- Connexion directe --- */
      .manual-btn {
        margin: 8px 10px; padding: 8px 10px; width: calc(100% - 20px);
        background: transparent; color: var(--text-dim);
        border: 1px dashed var(--border); border-radius: 8px;
        cursor: pointer; font-size: 13px; font-family: inherit;
      }
      .manual-btn:hover { color: var(--text); border-color: var(--accent); }

      .modal-backdrop {
        position: fixed; inset: 0; background: rgba(0,0,0,.62);
        display: none; align-items: center; justify-content: center; z-index: 50;
      }
      .modal-backdrop.open { display: flex; }
      .modal {
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 12px; padding: 22px; width: 380px;
        display: flex; flex-direction: column; gap: 12px;
        box-shadow: 0 18px 50px rgba(0,0,0,.5);
      }
      .modal h2 { margin: 0; font-size: 16px; }
      .modal-hint { margin: -6px 0 4px; font-size: 12px; color: var(--text-dim); }
      .modal label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--text-dim); }
      .modal input[type=text], .modal input[type=password], .modal input[type=number], .modal input:not([type]) {
        background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
        padding: 8px 10px; color: var(--text); font-family: inherit; font-size: 13px;
      }
      .modal input:focus { outline: none; border-color: var(--accent); }
      .auth-switch { display: flex; gap: 16px; font-size: 12px; }
      .auth-switch .radio { flex-direction: row; align-items: center; gap: 6px; color: var(--text); }
      .modal-error {
        margin: 0; padding: 8px 10px; border-radius: 7px; font-size: 12px;
        background: rgba(220,60,60,.14); border: 1px solid rgba(220,60,60,.4); color: #ff9a9a;
        white-space: pre-wrap;
      }
      .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
      .btn-primary, .btn-ghost {
        padding: 8px 14px; border-radius: 7px; cursor: pointer;
        font-family: inherit; font-size: 13px; border: 1px solid var(--border);
      }
      .btn-primary { background: var(--accent); color: #1a1020; border-color: var(--accent); font-weight: 600; }
      .btn-ghost { background: transparent; color: var(--text-dim); }
      .btn-primary:disabled { opacity: .55; cursor: progress; }
    </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="mascot">😈</span> Avash <span class="ver">v0.1</span>
      </div>
      <div class="search-wrap">
        <input id="search" class="search" placeholder="Filtrer les hôtes…" autocomplete="off" />
      </div>
      <div id="host-list" class="host-list"></div>
      <button id="manual-btn" class="manual-btn" type="button">＋ Connexion directe</button>
      <div class="footer"><span id="host-count">—</span><span>avash</span></div>
    </aside>

    <section class="main">
      <div class="tabs" id="tabs"><span style="color:var(--text-dim);font-size:12px;padding-left:6px;">Aucune session</span></div>
      <div class="terminal-zone">
        <div class="terminal-empty" id="terminal-empty">
          <div class="big">😼</div>
          <div class="hint">Double-clic sur un hôte pour te connecter — <kbd>Ctrl</kbd>+<kbd>K</kbd> palette</div>
        </div>
        <div id="terminal"></div>
        <aside class="sftp-panel" id="sftp-panel">
          <div class="sftp-head">
            <span>📁</span>
            <span class="sftp-path" id="sftp-path" title="Cliquer pour changer de chemin">…</span>
          </div>
          <div class="sftp-list" id="sftp-list"></div>
          <div class="sftp-foot">
            <button class="btn-mini" id="sftp-up-btn">⬆︎ Envoyer</button>
            <button class="btn-mini" id="sftp-refresh-btn">↻ Rafraîchir</button>
          </div>
          <div class="sftp-status" id="sftp-status">SFTP prêt</div>
        </aside>
      </div>
    </section>
  </div>

  <div class="palette-backdrop" id="palette">
    <div class="palette">
      <input id="palette-input" placeholder="Taper un nom d'hôte ou une commande…" autocomplete="off" />
      <div class="results" id="palette-results"></div>
    </div>
  </div>

  <script type="module" src="/main.ts"></script>

    <div class="modal-backdrop" id="manual-modal">
      <form class="modal" id="manual-form" autocomplete="off">
        <h2>Connexion directe</h2>
        <p class="modal-hint">Sans passer par <code>~/.ssh/config</code>.</p>

        <label>Adresse ou IP
          <input id="m-addr" name="addr" placeholder="192.168.1.10" required />
        </label>
        <label>Port
          <input id="m-port" name="port" type="number" min="1" max="65535" placeholder="22" />
        </label>
        <label>Utilisateur
          <input id="m-user" name="user" placeholder="root" required />
        </label>

        <div class="auth-switch">
          <label class="radio"><input type="radio" name="auth" value="password" checked /> Mot de passe</label>
          <label class="radio"><input type="radio" name="auth" value="key" /> Clé privée</label>
        </div>

        <label id="m-password-row">Mot de passe
          <input id="m-password" name="password" type="password" />
        </label>
        <label id="m-key-row" hidden>Chemin de la clé privée
          <input id="m-key" name="key" placeholder="~/.ssh/id_ed25519" />
        </label>

        <p class="modal-error" id="m-error" hidden></p>

        <div class="modal-actions">
          <button type="button" class="btn-ghost" id="m-cancel">Annuler</button>
          <button type="submit" class="btn-primary" id="m-submit">Se connecter</button>
        </div>
      </form>
    </div>
</body>
</html>
