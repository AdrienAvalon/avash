[package]
name = "avash"
version = "0.7.0"
edition = "2021"
# Application, pas bibliothèque : rien n'est publié sur crates.io. Le dire
# empêche une publication par mégarde, et lève l'avertissement de cargo-deny
# sur la dépendance de chemin interne.
publish = false
description = "Avash — native SSH/RDP connection manager. Light, fast, secure, multi-platform."
license = "AGPL-3.0-or-later"

[dependencies]
tokio = { version = "1", features = ["full"] }
# RSA est conserve volontairement. Il tire `rsa`, affecte par RUSTSEC-2023-0071
# (attaque Marvin, 5.9 moyenne, sans correctif amont). Le desactiver donne zero
# vulnerabilite, mais casse la connexion aux serveurs a cle d'hote RSA et aux
# cles id_rsa — verifie contre un vrai sshd : "Wrong server signature", message
# opaque pour l'utilisateur.
# Pour un gestionnaire de connexions, perdre cette compatibilite coute plus que
# ce canal temporel, exploitable seulement par un serveur malveillant mesurant
# des milliers de tentatives.
# Pour privilegier la securite au detriment de la compatibilite :
#   russh = { version = "0.63", default-features = false, features = ["flate2", "aws-lc-rs"] }
# `ring` plutot que `aws-lc-rs` (le defaut) : meme fonctionnement, verifie
# contre un vrai sshd, mais 2 Mo de moins sur le binaire final.
russh = { version = "0.63", default-features = false, features = [
    "flate2",
    "ring",
    "rsa",
] }
russh-sftp = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# Enregistrements asciicast : une ligne JSON par événement.
serde_json = "1"
dirs = "6"
anyhow = "1"
whoami = "2"
rand = "0.10"
keyring = "4"

# join_all : le téléchargement SFTP lit en bandes parallèles, dont le nombre
# dépend de la taille du fichier — tokio::join! ne prend qu'un nombre fixe de
# futures. `futures` est déjà dans l'arbre (russh en dépend).
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[dev-dependencies]
bytes = "1.12.1"
log = "0.4.34"

[lints]
workspace = true
