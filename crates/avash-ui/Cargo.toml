[package]
name = "avash-ui"
# Métadonnées héritées du workspace : un seul numéro à bumper pour une release.
# Trouvé par l'audit du 8 septembre 2026 : ces champs étaient codés en dur ici,
# si bien que la version du [workspace.package] n'était lue par personne.
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
# Application, pas bibliothèque : rien n'est publié sur crates.io. Le dire
# empêche une publication par mégarde, et lève l'avertissement de cargo-deny
# sur la dépendance de chemin interne.
publish = false
description = "Avash GUI — native shell (Tauri 2)"

[lib]
name = "avash_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Serveur WebDriver embarqué (tauri-plugin-wdio-webdriver), pour la suite bout
# en bout là où aucun pilote natif ne tient : Edge WebDriver ne lance plus une
# application WebView2 depuis sa version 133 (« DevToolsActivePort file doesn't
# exist »), macOS n'a pas de pilote du tout. Le serveur écoute sur 127.0.0.1
# dès que l'application démarre : jamais dans un binaire livré — la chaîne de
# publication ne pose pas cette fonctionnalité, seule la suite E2E la compile.
webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
avash = { path = "../avash" }
tokio = { version = "1", features = ["full"] }
whoami = "2"
open = "5.4.2"
zeroize = "1"
# Journal de l'application (audit du 12 septembre 2026, C-SIL-2) : l'application
# publiée n'écrivait nulle part, et tout échec sans remontée IPC disparaissait.
# `tracing-appender` n'est pas pris : il ne sait tourner que par date, et le
# journal doit rester borné en taille (deux fichiers d'un mégaoctet).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-wdio-webdriver = { version = "1.3", optional = true }

# Pageant (agent SSH de PuTTY) : le diagnostic le sonde pour ne pas annoncer
# « aucun agent » sur un poste où seul Pageant tourne (il n'expose pas le tube
# OpenSSH). Même transport que l'auth de la caisse `avash`. Cible Windows seule.
[target.'cfg(windows)'.dependencies]
pageant = "0.2"

[dev-dependencies]
# Moteur d'exécution factice de Tauri : de quoi construire un `State` et un
# `AppHandle` sans fenêtre, donc exercer les commandes et le magasin de sessions
# — la logique d'annulation pendant une connexion n'avait aucun test unitaire.
tauri = { version = "2", features = ["test"] }
# Temps figé (`start_paused`) : les tests du relais de sortie mesurent la
# fenêtre de regroupement et le filet de contre-pression sans dormir pour de
# vrai, et le délai de garde de l'annonce du sidecar (60 s) s'éprouve en un
# instant. Audit du 12 septembre 2026.
tokio = { version = "1", features = ["full", "test-util"] }
# Pseudo-terminal pour les tests de `serie_open` (audit du 12 septembre 2026,
# C-couv-5) : l'esclave tient lieu de port série, le maître de l'équipement.
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", features = ["term", "fs", "user"] }
# Serveur SSH+SFTP en mémoire du cœur (`avash::testutil::serveur_ssh`), pour
# éprouver les commandes SFTP, tunnels et dépôt de clé contre une vraie session
# (`commands/tests_reseau.rs`). Dépendance de développement seulement : le
# résolveur 2 ne l'unifie pas dans la construction d'un binaire publié. Audit
# du 12 septembre 2026 (C-couv-4).
avash = { path = "../avash", features = ["outils-de-test"] }

[[bench]]
name = "utf8"
harness = false

[[bench]]
name = "coalesce"
harness = false

[lints]
workspace = true
