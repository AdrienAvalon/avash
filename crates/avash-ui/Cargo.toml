[package]
name = "avash-ui"
version = "0.1.0"
edition = "2021"
description = "Avash GUI — native shell (Tauri 2)"

[lib]
name = "avash_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
avash = { path = "../avash" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
whoami = "2"

[[bench]]
name = "utf8"
harness = false

[[bench]]
name = "coalesce"
harness = false

[lints]
workspace = true
