[package]
name = "avash-ui"
version = "0.4.2"
license = "AGPL-3.0-or-later"
edition = "2021"
# Application, pas bibliothèque : rien n'est publié sur crates.io. Le dire
# empêche une publication par mégarde, et lève l'avertissement de cargo-deny
# sur la dépendance de chemin interne.
publish = false
description = "Avash GUI — native shell (Tauri 2)"

[lib]
name = "avash_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
avash = { path = "../avash" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
whoami = "2"
open = "5.4.2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"

[[bench]]
name = "utf8"
harness = false

[[bench]]
name = "coalesce"
harness = false

[lints]
workspace = true
