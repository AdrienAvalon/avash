  <!-- Cadenas -->
  <g>
    <path d="M230 322 V308 a26 26 0 0 1 52 0 V322" fill="none" stroke="url(#gold)" stroke-width="12"/>
    <rect x="212" y="320" width="88" height="70" rx="12" fill="url(#gold)" stroke="#8a5a06" stroke-width="2"/>
    <circle cx="256" cy="350" r="10" fill="#0b1526"/>
    <rect x="251" y="352" width="10" height="20" rx="3" fill="#0b1526"/>
