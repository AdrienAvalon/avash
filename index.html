<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avash 😼</title>
  <style>
    :root {
      --bg: #0f1117;
      --bg-soft: #161a23;
      --card: #1c212e;
      --border: #2a3040;
      --text: #e6e9f0;
      --text-dim: #8b93a7;
      --accent: #7c6cf5;
      --accent-glow: rgba(124, 108, 245, .35);
      --ok: #3fd68f;
      --warn: #f5b652;
      --err: #f56a6a;
      --mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .app { display: flex; height: 100vh; }

    /* ===== Sidebar ===== */
    .sidebar {
      width: 260px; min-width: 220px;
      background: var(--bg-soft);
      border-right: 1px solid var(--border, #232838);
      display: flex; flex-direction: column;
    }
    .brand {
      padding: 16px 18px 12px;
      display: flex; align-items: center; gap: 8px;
      font-weight: 700; font-size: 15px; letter-spacing: .3px;
    }
    .brand .mascot { font-size: 18px; }
    .brand .ver { margin-left: auto; color: var(--text-dim); font-size: 11px; font-weight: 400; }
    .search-wrap { padding: 0 12px 10px; position: relative; }
    .search {
      width: 100%; padding: 9px 12px 9px 32px;
      background: var(--card); border: 1px solid var(--border, #2a3040);
      border-radius: 9px; color: var(--text); font-size: 13px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .search-wrap::before {
      content: "⌕"; position: absolute; left: 11px; top: 9px;
      color: var(--text-dim); font-size: 15px;
    }
    .host-list { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
    .host {
      padding: 10px 12px; border-radius: 9px; cursor: pointer;
      display: flex; align-items: center; gap: 10px;
      transition: background .12s;
      margin-bottom: 2px;
    }
    .host:hover { background: rgba(124, 108, 245, .09); }
    .host.selected { background: rgba(124, 108, 245, .16); }
    .host .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-dim); opacity: .5; flex-shrink: 0;
      transition: background .2s, opacity .2s;
    }
    .host .dot.ok { background: var(--ok); opacity: 1; box-shadow: 0 0 6px var(--ok); }
    .host .dot.err { background: var(--err); opacity: 1; }
    .host .info { min-width: 0; }
    .host .alias { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .host .meta { font-size: 11px; color: var(--text-dim); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .footer { padding: 10px 14px; border-top: 1px solid var(--border, #2a3040); font-size: 11px; color: var(--text-dim); display: flex; justify-content: space-between; }

    /* ===== Main ===== */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .tabs {
      display: flex; align-items: center; gap: 4px;
      background: var(--bg-soft); border-bottom: 1px solid var(--border, #2a3040);
      padding: 6px 10px;
    }
    .tab {
      padding: 6px 14px; border-radius: 7px; font-size: 12.5px;
      background: transparent; color: var(--text-dim); cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      border: 1px solid transparent; transition: all .15s;
    }
    .tab.active { background: var(--card); color: var(--text); border-color: var(--border, #2a3040); }
    .tab .close { opacity: .5; font-size: 11px; cursor: pointer; }
    .tab .close:hover { opacity: 1; }
    .terminal-zone { flex: 1; position: relative; }
    .xterm-container { display: block; }
    .xterm, .xterm .xterm-screen { height: 100%; }
    .terminal-empty {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; color: var(--text-dim);
    }
    .terminal-empty .big { font-size: 42px; }
    .terminal-empty .hint { font-size: 13px; }
    .terminal-empty kbd {
      background: var(--card); border: 1px solid var(--border, #2a3040);
      border-radius: 5px; padding: 1px 7px; font-family: var(--mono); font-size: 12px;
    }

    /* ===== Command palette ===== */
    .palette-backdrop {
      position: fixed; inset: 0; background: rgba(8, 10, 16, .55);
      backdrop-filter: blur(3px); display: none; z-index: 50;
      align-items: flex-start; justify-content: center; padding-top: 12vh;
    }
    .palette-backdrop.open { display: flex; }
    .palette {
      width: min(560px, 90vw); background: var(--card);
      border: 1px solid var(--border, #2a3040); border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0,0,0,.5);
      overflow: hidden;
      animation: pop .12s ease-out;
    }
    @keyframes pop { from { transform: scale(.98) translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
    .palette input {
      width: 100%; padding: 15px 18px; background: transparent; border: none;
      outline: none; color: var(--text); font-size: 15px;
      border-bottom: 1px solid var(--border, #2a3040);
    }
    .palette .results { max-height: 320px; overflow-y: auto; padding: 6px; }
    .palette .item {
      padding: 10px 14px; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; gap: 10px; font-size: 13.5px;
    }
    .palette .item:hover, .palette .item.hl { background: rgba(124,108,245,.15); }
    .palette .item .sub { margin-left: auto; font-size: 11px; color: var(--text-dim); font-family: var(--mono); }
    .palette .empty { padding: 18px; text-align: center; color: var(--text-dim); font-size: 13px; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="mascot">😈</span> Avash <span class="ver">v0.1</span>
      </div>
      <div class="search-wrap">
        <input id="search" class="search" placeholder="Filtrer les hôtes…" autocomplete="off" />
      </div>
      <div id="host-list" class="host-list"></div>
      <div class="footer"><span id="host-count">—</span><span>avash</span></div>
    </aside>

    <section class="main">
      <div class="tabs" id="tabs"><span style="color:var(--text-dim);font-size:12px;padding-left:6px;">Aucune session</span></div>
      <div class="terminal-zone">
        <div class="terminal-empty" id="terminal-empty">
          <div class="big">😼</div>
          <div class="hint">Double-clic sur un hôte pour te connecter — <kbd>Ctrl</kbd>+<kbd>K</kbd> palette</div>
        </div>
        <div id="terminal"></div>
      </div>
    </section>
  </div>

  <div class="palette-backdrop" id="palette">
    <div class="palette">
      <input id="palette-input" placeholder="Taper un nom d'hôte ou une commande…" autocomplete="off" />
      <div class="results" id="palette-results"></div>
    </div>
  </div>

  <script type="module" src="/main.ts"></script>
</body>
</html>
