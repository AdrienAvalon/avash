[package]
name = "avash-rdp"
version = "0.8.0"
edition = "2021"
# Application, pas bibliothèque : rien n'est publié sur crates.io. Le dire
# empêche une publication par mégarde, et lève l'avertissement de cargo-deny
# sur la dépendance de chemin interne.
publish = false
description = "Avash — sidecar client RDP (IronRDP), isolé de russh"
license = "AGPL-3.0-or-later"

[[bin]]
name = "avash-rdp"
path = "src/main.rs"

[dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ironrdp = { version = "0.17", default-features = false, features = ["connector", "session", "graphics", "input", "svc", "dvc", "displaycontrol", "cliprdr", "pdu", "core"] }
ironrdp-tokio = { version = "0.10", features = ["reqwest"] }
ironrdp-tls = { version = "0.2", features = ["rustls"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
x509-cert = "0.2"
tokio-tungstenite = "0.30"
futures-util = "0.3.34"
rand = "0.10.2"
sha2 = "0.11"
dirs = "6"
# Client VNC (RFB 3.8, ZRLE, CopyRect, Raw) : copie portée, voir vendor/README.md.
vnc-rs = "0.5.3"
# Les listes de fichiers du presse-papiers voyagent en JSON vers l'interface.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# O_NOFOLLOW pour l'ouverture sûre du fichier de trace (fuite du mot de passe
# sinon possible via un lien symbolique planté dans /tmp). Unix seulement.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Chemin chaud CPU-bound (décodage graphique) : LTO + une seule unité de
# codegen pour l'inlining inter-crates ; strip pour un binaire plus compact.
# Les dépendances optimisées même en développement : les tests rejouent des
# enregistrements réels à travers RLGR, les ondelettes, ClearCodec et NSCodec,
# et le fuzzing par mutation en fait cent cinquante tours. Non optimisées,
# elles coûtaient 224 s par exécution de la suite (mesuré le 2026-09-04 avec
# cinq fixtures). Notre propre code reste au niveau 0, débogable et vite
# recompilé.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true


[patch.crates-io]
ironrdp-session = { path = "vendor/ironrdp-session" }
ironrdp-connector = { path = "vendor/ironrdp-connector" }
# Porté pour un défaut de ClearCodec, trouvé contre un Windows réel : voir
# vendor/README.md.
ironrdp-pdu = { path = "vendor/ironrdp-pdu" }
# Porté pour le sous-codec NSCodec de ClearCodec, absent de l'amont : les
# icônes de la barre des tâches de Windows arrivaient noires. Voir
# vendor/README.md.
ironrdp-graphics = { path = "vendor/ironrdp-graphics" }
# Porté pour borner ce qu'un serveur VNC fait allouer, retirer deux
# comportements indéfinis et détacher la file des événements du verrou du
# client. Voir vendor/README.md.
vnc-rs = { path = "vendor/vnc-rs" }
