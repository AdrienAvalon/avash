# Chaîne d'intégration GitLab.
#
# Elle reprend, étape pour étape, celle de GitHub (.github/workflows/ci.yml).
# Jusqu'ici GitLab recevait chaque poussée sans rien vérifier : le miroir était
# un dépôt de sauvegarde, pas un garde-fou. Deux dépôts, une seule chaîne qui
# contrôle, cela veut dire qu'une régression pouvait y dormir.
#
# Une seule étape de GitHub manque ici, à dessein : la régression visuelle
# (e2e/specs/visuel.spec.js), dont les références sont des captures
# d'ubuntu-latest. Dans un conteneur Debian les polices ne rendent pas pareil
# et la comparaison, à 0,5 % de pixels près, ne dirait rien.
#
# Elle tourne sur l'exécuteur du poste du mainteneur (Docker privilégié, socket
# du démon monté, voir CONTRIBUTING.md, section « Exécuteur GitLab ») : poste
# éteint, les travaux attendent et reprennent au démarrage suivant.
#
# Les jobs tournent dans une image de base (ci/Dockerfile) construite sur le
# démon de l'hôte par le premier job, jamais publiée : les paquets, Node, les
# composants Rust et les outils cargo y sont figés, au lieu d'être réinstallés
# par chaque job à chaque passage.

stages: [preparer, verifier, eprouver]

# Pas de pipeline sur un tag : il pointe sur un commit que la branche vient de
# vérifier, et la publication (binaires, manifeste signé) est le travail du
# workflow Release de GitHub. Mesuré sur v0.7.0 : 38 minutes pour refaire à
# l'identique, à froid, ce que la branche venait de faire.
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

variables:
  CARGO_TERM_COLOR: "always"
  # Registre cargo et cache npm dans le projet, pour être mis en cache.
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  IMAGE_CI: "avash-ci:bookworm"

# --- Caches, découpés par usage ------------------------------------------
# Un seul cache pour tout le monde archivait plusieurs gigaoctets à la fin de
# CHAQUE job — quatre minutes pour le job front, qui n'en touche pas un octet.
# Chaque job ne restaure et ne réarchive que ce qu'il utilise, et un job qui ne
# produit rien de neuf ne réarchive pas (policy: pull). Toute autre référence
# que main part du cache de main plutôt que de zéro.
.cache-registre: &cache-registre
  key: "registre-$CI_COMMIT_REF_SLUG"
  fallback_keys: ["registre-main-protected", "registre-main"]
  paths: [".cargo/registry", ".cargo/git", ".cargo/advisory-db", ".cargo/advisory-dbs"]
.cache-cible: &cache-cible
  key: "cible-$CI_COMMIT_REF_SLUG"
  fallback_keys: ["cible-main-protected", "cible-main"]
  paths: ["target", "test-rdp-server/target"]
.cache-sidecar: &cache-sidecar
  key: "sidecar-$CI_COMMIT_REF_SLUG"
  fallback_keys: ["sidecar-main-protected", "sidecar-main"]
  paths: ["rdp-sidecar/target"]
.cache-npm: &cache-npm
  key: "npm-$CI_COMMIT_REF_SLUG"
  fallback_keys: ["npm-main-protected", "npm-main"]
  paths: [".npm"]

default:
  image:
    name: "$IMAGE_CI"
    pull_policy: if-not-present

# --- L'image de base, sur le démon de l'hôte -------------------------------
# Quelques secondes quand rien n'a changé (couches en cache), une dizaine de
# minutes quand ci/Dockerfile change. La sortie est tue : le pare-feu devant
# GitLab rejette un journal qui cite le fichier sshd_config par son chemin
# sous /etc (il a même rejeté ce fichier YAML envoyé à son linter tant que ce
# commentaire l'écrivait en toutes lettres) ; en cas d'échec, les erreurs sont
# montrées avec ce chemin désamorcé.
image-ci:
  stage: preparer
  image: docker:27
  cache: []
  script:
    - docker build -q -t "$IMAGE_CI" -f ci/Dockerfile ci >/dev/null 2>/tmp/erreurs || { sed -E 's#/etc/#/etc /#g' /tmp/erreurs; exit 1; }
    - docker image inspect "$IMAGE_CI" --format 'image {{index .RepoTags 0}}, {{.Size}} octets'

# --- Front d'abord : la compilation de avash-ui exige web/dist ------------
front:
  stage: verifier
  cache: [*cache-npm]
  script:
    - ./scripts/guard.sh          # restes de mise au point
    - cd web && npm ci
    - npm audit --audit-level=high   # le front est le périmètre de confiance réel
    - npx eslint .                   # tous les modules, pas une liste qui prend du retard
    - npx stylelint index.html       # le CSS vit dans la page
    - npx knip                       # fichiers jamais importés, exports jamais lus
    - npx tsc --noEmit
    - npx vitest run
    - npx vite build
  artifacts:
    paths: ["web/dist"]
    expire_in: 1 day

# --- Cœur et interface ----------------------------------------------------
rust:
  stage: verifier
  needs: ["front"]
  cache: [*cache-registre, *cache-cible, *cache-sidecar]
  script:
    # Le processus RDP est déclaré en ressource embarquée : son binaire doit
    # exister AVANT toute compilation de avash-ui.
    - cargo build --release --manifest-path rdp-sidecar/Cargo.toml
    - mkdir -p crates/avash-ui/binaries
    - cp rdp-sidecar/target/release/avash-rdp crates/avash-ui/binaries/avash-rdp-x86_64-unknown-linux-gnu
    - cargo fmt --all --check
    - cargo clippy --workspace --all-targets -- -D warnings
    # clippy ne compile qu'en debug : un bloc sous cfg(debug_assertions) peut
    # laisser une variable inutilisée en release sans que rien ne le signale.
    - cargo clippy --workspace --release -- -D warnings
    - cargo test --workspace --all-targets
    - cargo build --release -p avash-ui

# --- Processus RDP : hors espace de travail, donc invisible de --workspace --
processus-rdp:
  stage: verifier
  cache: [*cache-registre, *cache-sidecar]
  script:
    - cd rdp-sidecar
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test
    # Les correctifs portés sur IronRDP ont leurs propres tests. Ces lignes
    # existaient déjà et ne lançaient RIEN : les manifestes vendorisés portaient
    # « test = false », hérité de l'amont, et quatorze tests passaient pour verts
    # sans jamais tourner. On compte donc ce qui s'exécute.
    - ./verifier-portes.sh

# --- Chaîne d'approvisionnement ------------------------------------------
dependances:
  stage: verifier
  cache: [*cache-registre]
  script:
    - cargo audit --deny unsound --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0429
    - cargo audit --deny unsound --ignore RUSTSEC-2023-0071 --file rdp-sidecar/Cargo.lock
    - cargo deny check advisories licenses bans sources
    - cargo deny --manifest-path rdp-sidecar/Cargo.toml check advisories licenses bans sources
  allow_failure: false

# --- Bout en bout : l'application réelle, sans affichage ------------------
bout-en-bout:
  stage: eprouver
  needs: ["front"]
  cache: [*cache-registre, *cache-cible, *cache-sidecar, *cache-npm]
  script:
    - cargo build --release --manifest-path rdp-sidecar/Cargo.toml
    - mkdir -p crates/avash-ui/binaries
    - cp rdp-sidecar/target/release/avash-rdp crates/avash-ui/binaries/avash-rdp-x86_64-unknown-linux-gnu
    - cargo build --release -p avash-ui
    # Serveur RDP de test et son certificat auto-signé (non versionné) : les
    # scénarios à serveurs locaux tournent ici aussi, comme sur GitHub.
    - cargo build --release --manifest-path test-rdp-server/Cargo.toml
    - openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj "/CN=localhost"
        -keyout test-rdp-server/key.pem -out test-rdp-server/cert.pem 2>/dev/null
    # Ici le harnais tourne en root (conteneur), et sshd lancé par root exige
    # le répertoire de séparation de privilèges. L'image le crée ; on s'en
    # assure, /run pouvant être remonté.
    - mkdir -p /run/sshd
    - cd e2e && npm ci
    - npm audit --audit-level=critical   # code de test seulement : on ne bloque que sur « critique »
    - xvfb-run -a npm test

# --- Conformité RDP : de VRAIS serveurs xrdp -----------------------------
# Les trois défauts RDP de la 0.3.3 — image cisaillée, clavier en QWERTY,
# connexion suspendue — ont été signalés par l'usage. Aucun n'était visible
# depuis les tests. Ce travail est le seul qui les aurait vus.
#
# Le parc tourne sur le démon Docker de l'hôte (socket monté par l'exécuteur),
# plus en docker-in-docker : ses trois images, longues à construire, sont
# construites une fois et gardées. Ses conteneurs vivent sur un réseau Docker
# dédié, sans publier de port ; le job s'y raccorde et les joint par leur
# adresse sur ce réseau (voir scripts/parc-rdp.sh). Rien n'écoute sur le
# réseau du poste.
conformite:
  stage: eprouver
  cache:
    - *cache-registre
    - <<: *cache-sidecar
      policy: pull   # le job rust vient de construire le même binaire release
  variables:
    PARC_RESEAU: "avash-parc"
    # Un conteneur n'a pas de disposition clavier (ni localectl ni session) :
    # le processus RDP annonçait 0, exactement ce que le contrôle traque. On
    # joue un poste en français, et le contrôle exige la valeur exacte
    # (fr → 0x040C = 1036) — même réglage que la chaîne GitHub.
    XKB_DEFAULT_LAYOUT: "fr"
    DISPOSITION_ATTENDUE: "1036"
  script:
    - cargo build --release --manifest-path rdp-sidecar/Cargo.toml
    - ./scripts/parc-rdp.sh up tous
    - ./scripts/conformite.sh tous
  after_script:
    - ./scripts/parc-rdp.sh down || true
