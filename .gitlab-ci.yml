# Chaîne d'intégration GitLab.
#
# Elle reprend, étape pour étape, celle de GitHub (.github/workflows/ci.yml).
# Jusqu'ici GitLab recevait chaque poussée sans rien vérifier : le miroir était
# un dépôt de sauvegarde, pas un garde-fou. Deux dépôts, une seule chaîne qui
# contrôle, cela veut dire qu'une régression pouvait y dormir.
#
# Elle tourne sur l'exécuteur du poste du mainteneur (Docker privilégié, voir
# CONTRIBUTING.md, section « Exécuteur GitLab ») : poste éteint, les travaux
# attendent et reprennent au démarrage suivant.

stages: [verifier, eprouver]

variables:
  CARGO_TERM_COLOR: "always"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

default:
  image: rust:1-bookworm
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    # .cargo/bin aussi : sans lui, tauri-driver, cargo-audit et cargo-deny se
    # recompilaient à chaque passage. Et avec lui, le registre des paquets
    # installés (.crates.toml, .crates2.json) : sans ce registre, cargo install
    # prend les binaires restaurés pour des intrus et refuse de les écraser
    # (« binary already exists in destination ») — vu au deuxième passage.
    paths:
      - ".cargo/registry"
      - ".cargo/git"
      - ".cargo/bin"
      - ".cargo/.crates.toml"
      - ".cargo/.crates2.json"
      - "target"
      # Les deux paquets hors espace de travail ont leur propre cible : sans
      # elles, le processus RDP se recompilait de zéro (plus de quatre
      # minutes) dans trois jobs à chaque passage.
      - "rdp-sidecar/target"
      - "test-rdp-server/target"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev
        libayatana-appindicator3-dev librsvg2-dev patchelf
    # Node 22, comme la chaîne GitHub : bookworm n'en fournit que la 18, sous
    # le plancher de stylelint et knip (20) — vu au premier passage réel.
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y -qq nodejs
    # L'image rust:1 n'embarque ni rustfmt ni clippy — vu au même passage.
    - rustup component add rustfmt clippy

# --- Front d'abord : la compilation de avash-ui exige web/dist ------------
front:
  stage: verifier
  script:
    - ./scripts/guard.sh          # restes de mise au point
    - cd web && npm ci
    - npm audit --audit-level=high   # le front est le périmètre de confiance réel
    - npx eslint .                   # tous les modules, pas une liste qui prend du retard
    - npx stylelint index.html       # le CSS vit dans la page
    - npx knip                       # fichiers jamais importés, exports jamais lus
    - npx tsc --noEmit
    - npx vitest run
    - npx vite build
  artifacts:
    paths: ["web/dist"]
    expire_in: 1 day

# --- Cœur et interface ----------------------------------------------------
rust:
  stage: verifier
  needs: ["front"]
  script:
    # Le processus RDP est déclaré en ressource embarquée : son binaire doit
    # exister AVANT toute compilation de avash-ui.
    - cargo build --release --manifest-path rdp-sidecar/Cargo.toml
    - mkdir -p crates/avash-ui/binaries
    - cp rdp-sidecar/target/release/avash-rdp crates/avash-ui/binaries/avash-rdp-x86_64-unknown-linux-gnu
    - cargo fmt --all --check
    - cargo clippy --workspace --all-targets -- -D warnings
    # clippy ne compile qu'en debug : un bloc sous cfg(debug_assertions) peut
    # laisser une variable inutilisée en release sans que rien ne le signale.
    - cargo clippy --workspace --release -- -D warnings
    - cargo test --workspace --all-targets
    - cargo build --release -p avash-ui

# --- Processus RDP : hors espace de travail, donc invisible de --workspace --
processus-rdp:
  stage: verifier
  # Ni WebKit ni Node ici : le processus RDP ne dépend d'aucune bibliothèque
  # système. Seuls les composants de la chaîne Rust manquent à l'image.
  before_script:
    - rustup component add rustfmt clippy
  script:
    - cd rdp-sidecar
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test
    # Les correctifs portés sur IronRDP ont leurs propres tests. Ces lignes
    # existaient déjà et ne lançaient RIEN : les manifestes vendorisés portaient
    # « test = false », hérité de l'amont, et quatorze tests passaient pour verts
    # sans jamais tourner. On compte donc ce qui s'exécute.
    - ./verifier-portes.sh

# --- Chaîne d'approvisionnement ------------------------------------------
dependances:
  stage: verifier
  # Les deux outils lisent les Cargo.lock : rien à installer sur le système.
  # cargo-deny clone la base d'avis avec le git de la ligne de commande, et le
  # git 2.39 de bookworm reçoit un 401 de GitHub sur le POST git-upload-pack
  # en HTTP/2 (le GET passe ; cargo-audit, en gix, passe) — vu au premier
  # passage réel, reproduit dans un conteneur nu.
  before_script:
    - git config --global http.version HTTP/1.1
  script:
    # N'installer que ce qui manque : le cache rend les binaires mais son
    # registre (.crates.toml) n'y entre qu'après un succès, et sans registre
    # cargo install refuse d'écraser (« binary already exists ») — le job
    # échouait donc à chaque passage suivant, et le cache n'était jamais
    # complété. Vu aux deuxième et troisième passages.
    - for outil in cargo-audit cargo-deny; do test -x "$CARGO_HOME/bin/$outil" || cargo install "$outil" --locked; done
    - cargo audit --deny unsound --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0429
    - cargo audit --deny unsound --ignore RUSTSEC-2023-0071 --file rdp-sidecar/Cargo.lock
    - cargo deny check advisories licenses bans sources
    - cargo deny --manifest-path rdp-sidecar/Cargo.toml check advisories licenses bans sources
  allow_failure: false

# --- Bout en bout : l'application réelle, sans affichage ------------------
bout-en-bout:
  stage: eprouver
  needs: ["front"]
  script:
    - apt-get install -y -qq webkit2gtk-driver xvfb
    # Même garde que pour cargo-audit : le binaire en cache suffit.
    - test -x "$CARGO_HOME/bin/tauri-driver" || cargo install tauri-driver --locked
    # CARGO_HOME est redirigé dans le projet (cache) : le harnais lance
    # `tauri-driver` par son nom, il doit le trouver sur le PATH.
    - export PATH="$CARGO_HOME/bin:$PATH"
    - cargo build --release --manifest-path rdp-sidecar/Cargo.toml
    - mkdir -p crates/avash-ui/binaries
    - cp rdp-sidecar/target/release/avash-rdp crates/avash-ui/binaries/avash-rdp-x86_64-unknown-linux-gnu
    - cargo build --release -p avash-ui
    # Serveur RDP de test et son certificat auto-signé (non versionné) : les
    # scénarios à serveurs locaux tournent ici aussi, comme sur GitHub.
    # Installation muette : GitLab est derrière le pare-feu applicatif de
    # Cloudflare, qui a rejeté (403) le morceau de journal contenant la ligne
    # de dpkg « Creating config file /etc/ssh/sshd_config with new version »
    # — un chemin système sensible à ses yeux. Le runner annule alors le job,
    # que GitLab marque « unknown_failure » sans un mot : trois passages
    # perdus au même endroit, le déclencheur retrouvé en bissectant la sortie
    # du conteneur contre le pare-feu. Les erreurs restent sur stderr.
    # libopus-dev et cmake : le serveur RDP de test dépend de libopus_sys, qui
    # sans Opus système le compile lui-même par CMake — absent de l'image,
    # d'où « is cmake not installed? » au quatrième passage. Avec la
    # bibliothèque de Debian, pkg-config la trouve et rien n'est compilé.
    - apt-get install -y -qq openssh-server openssl libopus-dev cmake >/dev/null
    # Ici le harnais tourne en root (conteneur), et sshd lancé par root exige
    # le répertoire de séparation de privilèges, que le paquet ne crée pas sans
    # systemd : « Missing privilege separation directory: /run/sshd ». Sur
    # GitHub le harnais est un utilisateur ordinaire et sshd s'en passe.
    - mkdir -p /run/sshd
    - cargo build --release --manifest-path test-rdp-server/Cargo.toml
    - openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj "/CN=localhost"
        -keyout test-rdp-server/key.pem -out test-rdp-server/cert.pem 2>/dev/null
    - cd e2e && npm ci
    - npm audit --audit-level=critical   # code de test seulement : on ne bloque que sur « critique »
    - xvfb-run -a npm test

# --- Conformité RDP : de VRAIS serveurs xrdp -----------------------------
# Les trois défauts RDP de la 0.3.3 — image cisaillée, clavier en QWERTY,
# connexion suspendue — ont été signalés par l'usage. Aucun n'était visible
# depuis les tests. Ce travail est le seul qui les aurait vus.
conformite:
  stage: eprouver
  image: docker:27
  services: ["docker:27-dind"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache bash python3 py3-numpy py3-pillow py3-websockets curl build-base
    - curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
    - . "$HOME/.cargo/env"
  script:
    - cargo build --release --manifest-path rdp-sidecar/Cargo.toml
    - ./scripts/parc-rdp.sh up tous
    - ./scripts/conformite.sh tous
  after_script:
    - ./scripts/parc-rdp.sh down || true
